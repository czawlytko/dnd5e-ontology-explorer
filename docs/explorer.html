"A flame, equivalent in brightness to a torch, springs forth from an object that you touch. The effect looks like a regular flame, but it creates no heat and doesn't use oxygen. A continual flame can be covered or hidden but not smothered or quenched.","parents":["ttrpg:Spell"]},{"id":"dnd:ControlWater","label":"Control Water","comment":"Until the spell ends, you control any freestanding water inside an area you choose that is a cube up to 100 feet on a side. You can choose from any of the following effects when you cast this spell. As an action on your turn, you can repeat the same effect or choose a different one.","parents":["ttrpg:Spell"]},{"id":"dnd:ControlWeather","label":"Control Weather","comment":"You take control of the weather within 5 miles of you for the duration. You must be outdoors to cast this spell. Moving to a place where you don't have a clear path to the sky ends the spell early.","parents":["ttrpg:Spell"]},{"id":"dnd:Counterspell","label":"Counterspell","comment":"You attempt to interrupt a creature in the process of casting a spell. If the creature is casting a spell of 3rd level or lower, its spell fails and has no effect. If it is casting a spell of 4th level or higher, make an ability check using your spellcasting ability. The DC equals 10 + the spell's level. On a success, the creature's spell fails and has no effect.","parents":["ttrpg:Spell"]},{"id":"dnd:CreateFoodAndWater","label":"Create Food And Water","comment":"You create 45 pounds of food and 30 gallons of water on the ground or in containers within range, enough to sustain up to fifteen humanoids or five steeds for 24 hours. The food is bland but nourishing, and spoils if uneaten after 24 hours. The water is clean and doesn't go bad.","parents":["ttrpg:Spell"]},{"id":"dnd:CreateOrDestroyWater","label":"Create Or Destroy Water","comment":"You either create or destroy water.","parents":["ttrpg:Spell"]},{"id":"dnd:CreateUndead","label":"Create Undead","comment":"You can cast this spell only at night. Choose up to three corpses of Medium or Small humanoids within range. Each corpse becomes a ghoul under your control. (The DM has game statistics for these creatures.)","parents":["ttrpg:Spell"]},{"id":"dnd:Creation","label":"Creation","comment":"You pull wisps of shadow material from the Shadowfell to create a nonliving object of vegetable matter within range: soft goods, rope, wood, or something similar. You can also use this spell to create mineral objects such as stone, crystal, or metal. The object created must be no larger than a 5-foot cube, and the object must be of a form and material that you have seen before.","parents":["ttrpg:Spell"]},{"id":"dnd:CureWounds","label":"Cure Wounds","comment":"A creature you touch regains a number of hit points equal to 1d8 + your spellcasting ability modifier. This spell has no effect on undead or constructs.","parents":["ttrpg:Spell"]},{"id":"dnd:DancingLights","label":"Dancing Lights","comment":"You create up to four torch-sized lights within range, making them appear as torches, lanterns, or glowing orbs that hover in the air for the duration. You can also combine the four lights into one glowing vaguely humanoid form of Medium size. Whichever form you choose, each light sheds dim light in a 10-foot radius.","parents":["ttrpg:Spell"]},{"id":"dnd:Darkness","label":"Darkness","comment":"Magical darkness spreads from a point you choose within range to fill a 15-foot-radius sphere for the duration. The darkness spreads around corners. A creature with darkvision can't see through this darkness, and nonmagical light can't illuminate it.","parents":["ttrpg:Spell"]},{"id":"dnd:Darkvision","label":"Darkvision","comment":"You touch a willing creature to grant it the ability to see in the dark. For the duration, that creature has darkvision out to a range of 60 feet.","parents":["ttrpg:Spell"]},{"id":"dnd:Daylight","label":"Daylight","comment":"A 60-foot-radius sphere of light spreads out from a point you choose within range. The sphere is bright light and sheds dim light for an additional 60 feet.","parents":["ttrpg:Spell"]},{"id":"dnd:DeathWard","label":"Death Ward","comment":"You touch a creature and grant it a measure of protection from death.","parents":["ttrpg:Spell"]},{"id":"dnd:DelayedBlastFireball","label":"Delayed Blast Fireball","comment":"A beam of yellow light flashes from your pointing finger, then condenses to linger at a chosen point within range as a glowing bead for the duration. When the spell ends, either because your concentration is broken or because you decide to end it, the bead blossoms with a low roar into an explosion of flame that spreads around corners. Each creature in a 20-foot-radius sphere centered on that point must make a dexterity saving throw. A creature takes fire damage equal to the total accumulated damage on a failed save, or half as much damage on a successful one.","parents":["ttrpg:Spell"]},{"id":"dnd:Demiplane","label":"Demiplane","comment":"You create a shadowy door on a flat solid surface that you can see within range. The door is large enough to allow Medium creatures to pass through unhindered. When opened, the door leads to a demiplane that appears to be an empty room 30 feet in each dimension, made of wood or stone. When the spell ends, the door disappears, and any creatures or objects inside the demiplane remain trapped there, as the door also disappears from the other side.","parents":["ttrpg:Spell"]},{"id":"dnd:DetectEvilAndGood","label":"Detect Evil And Good","comment":"For the duration, you know if there is an aberration, celestial, elemental, fey, fiend, or undead within 30 feet of you, as well as where the creature is located. Similarly, you know if there is a place or object within 30 feet of you that has been magically consecrated or desecrated.","parents":["ttrpg:Spell"]},{"id":"dnd:DetectMagic","label":"Detect Magic","comment":"For the duration, you sense the presence of magic within 30 feet of you. If you sense magic in this way, you can use your action to see a faint aura around any visible creature or object in the area that bears magic, and you learn its school of magic, if any.","parents":["ttrpg:Spell"]},{"id":"dnd:DetectPoisonAndDisease","label":"Detect Poison And Disease","comment":"For the duration, you can sense the presence and location of poisons, poisonous creatures, and diseases within 30 feet of you. You also identify the kind of poison, poisonous creature, or disease in each case.","parents":["ttrpg:Spell"]},{"id":"dnd:DetectThoughts","label":"Detect Thoughts","comment":"For the duration, you can read the thoughts of certain creatures. When you cast the spell and as your action on each turn until the spell ends, you can focus your mind on any one creature that you can see within 30 feet of you. If the creature you choose has an Intelligence of 3 or lower or doesn't speak any language, the creature is unaffected.","parents":["ttrpg:Spell"]},{"id":"dnd:DimensionDoor","label":"Dimension Door","comment":"You teleport yourself from your current location to any other spot within range. You arrive at exactly the spot desired. It can be a place you can see, one you can visualize, or one you can describe by stating distance and direction, such as '200 feet straight downward' or 'upward to the northwest at a 45-degree angle, 300 feet.'","parents":["ttrpg:Spell"]},{"id":"dnd:DisguiseSelf","label":"Disguise Self","comment":"You make yourself--including your clothing, armor, weapons, and other belongings on your person--look different until the spell ends or until you use your action to dismiss it. You can seem 1 foot shorter or taller and can appear thin, fat, or in between. You can't change your body type, so you must adopt a form that has the same basic arrangement of limbs. Otherwise, the extent of the illusion is up to you.","parents":["ttrpg:Spell"]},{"id":"dnd:Disintegrate","label":"Disintegrate","comment":"A thin green ray springs from your pointing finger to a target that you can see within range. The target can be a creature, an object, or a creation of magical force, such as the wall created by wall of force.","parents":["ttrpg:Spell"]},{"id":"dnd:DispelEvilAndGood","label":"Dispel Evil And Good","comment":"Shimmering energy surrounds and protects you from fey, undead, and creatures originating from beyond the Material Plane. For the duration, celestials, elementals, fey, fiends, and undead have disadvantage on attack rolls against you.","parents":["ttrpg:Spell"]},{"id":"dnd:DispelMagic","label":"Dispel Magic","comment":"Choose one creature, object, or magical effect within range. Any spell of 3rd level or lower on the target ends. For each spell of 4th level or higher on the target, make an ability check using your spellcasting ability. The DC equals 10 + the spell's level. On a successful check, the spell ends.","parents":["ttrpg:Spell"]},{"id":"dnd:DivineFavor","label":"Divine Favor","comment":"Your prayer empowers you with divine radiance. Until the spell ends, your weapon attacks deal an extra 1d4 radiant damage on a hit.","parents":["ttrpg:Spell"]},{"id":"dnd:DivineWord","label":"Divine Word","comment":"You utter a divine word, imbued with the power that shaped the world at the dawn of creation. Choose any number of creatures you can see within range. Each creature that can hear you must make a Charisma saving throw. On a failed save, a creature suffers an effect based on its current hit points:","parents":["ttrpg:Spell"]},{"id":"dnd:DominateBeast","label":"Dominate Beast","comment":"You attempt to beguile a creature that you can see within range. It must succeed on a wisdom saving throw or be charmed by you for the duration. If you or creatures that are friendly to you are fighting it, it has advantage on the saving throw.","parents":["ttrpg:Spell"]},{"id":"dnd:DominateMonster","label":"Dominate Monster","comment":"You attempt to beguile a creature that you can see within range. It must succeed on a wisdom saving throw or be charmed by you for the duration. If you or creatures that are friendly to you are fighting it, it has advantage on the saving throw.","parents":["ttrpg:Spell"]},{"id":"dnd:DominatePerson","label":"Dominate Person","comment":"You attempt to beguile a humanoid that you can see within range. It must succeed on a wisdom saving throw or be charmed by you for the duration. If you or creatures that are friendly to you are fighting it, it has advantage on the saving throw.","parents":["ttrpg:Spell"]},{"id":"dnd:Dream","label":"Dream","comment":"This spell shapes a creature's dreams. Choose a creature known to you as the target of this spell. The target must be on the same plane of existence as you. Creatures that don't sleep, such as elves, can't be contacted by this spell. You, or a willing creature you touch, enters a trance state, acting as a messenger.","parents":["ttrpg:Spell"]},{"id":"dnd:Druidcraft","label":"Druidcraft","comment":"Whispering to the spirits of nature, you create one of the following effects within 'range':","parents":["ttrpg:Spell"]},{"id":"dnd:Earthquake","label":"Earthquake","comment":"You create a seismic disturbance at a point on the ground that you can see within range. For the duration, an intense tremor rips through the ground in a 100-foot-radius circle centered on that point and shakes creatures and structures in contact with the ground in that area.","parents":["ttrpg:Spell"]},{"id":"dnd:EldritchBlast","label":"Eldritch Blast","comment":"A beam of crackling energy streaks toward a creature within range. Make a ranged spell attack against the target. On a hit, the target takes 1d10 force damage. The spell creates more than one beam when you reach higher levels: two beams at 5th level, three beams at 11th level, and four beams at 17th level. You can direct the beams at the same target or at different ones. Make a separate attack roll for each beam.","parents":["ttrpg:Spell"]},{"id":"dnd:EnhanceAbility","label":"Enhance Ability","comment":"You touch a creature and bestow upon it a magical enhancement. Choose one of the following effects; the target gains that effect until the spell ends.","parents":["ttrpg:Spell"]},{"id":"dnd:EnlargeReduce","label":"Enlarge Reduce","comment":"You cause a creature or an object you can see within range to grow larger or smaller for the duration. Choose either a creature or an object that is neither worn nor carried. If the target is unwilling, it can make a Constitution saving throw. On a success, the spell has no effect.","parents":["ttrpg:Spell"]},{"id":"dnd:Entangle","label":"Entangle","comment":"Grasping weeds and vines sprout from the ground in a 20-foot square starting form a point within range. For the duration, these plants turn the ground in the area into difficult terrain.","parents":["ttrpg:Spell"]},{"id":"dnd:Enthrall","label":"Enthrall","comment":"You weave a distracting string of words, causing creatures of your choice that you can see within range and that can hear you to make a wisdom saving throw. Any creature that can't be charmed succeeds on this saving throw automatically, and if you or your companions are fighting a creature, it has advantage on the save. On a failed save, the target has disadvantage on Wisdom (Perception) checks made to perceive any creature other than you until the spell ends or until the target can no longer hear you. The spell ends if you are incapacitated or can no longer speak.","parents":["ttrpg:Spell"]},{"id":"dnd:Etherealness","label":"Etherealness","comment":"You step into the border regions of the Ethereal Plane, in the area where it overlaps with your current plane. You remain in the Border Ethereal for the duration or until you use your action to dismiss the spell. During this time, you can move in any direction. If you move up or down, every foot of movement costs an extra foot. You can see and hear the plane you originated from, but everything there looks gray, and you can't see anything more than 60 feet away.","parents":["ttrpg:Spell"]},{"id":"dnd:ExpeditiousRetreat","label":"Expeditious Retreat","comment":"This spell allows you to move at an incredible pace. When you cast this spell, and then as a bonus action on each of your turns until the spell ends, you can take the Dash action.","parents":["ttrpg:Spell"]},{"id":"dnd:Eyebite","label":"Eyebite","comment":"For the spell's duration, your eyes become an inky void imbued with dread power. One creature of your choice within 60 feet of you that you can see must succeed on a wisdom saving throw or be affected by one of the following effects of your choice for the duration. On each of your turns until the spell ends, you can use your action to target another creature but can't target a creature again if it has succeeded on a saving throw against this casting of eyebite.","parents":["ttrpg:Spell"]},{"id":"dnd:Fabricate","label":"Fabricate","comment":"You convert raw materials into products of the same material. For example, you can fabricate a wooden bridge from a clump of trees, a rope from a patch of hemp, and clothes from flax or wool.","parents":["ttrpg:Spell"]},{"id":"dnd:FaerieFire","label":"Faerie Fire","comment":"Each object in a 20-foot cube within range is outlined in blue, green, or violet light (your choice). Any creature in the area when the spell is cast is also outlined in light if it fails a dexterity saving throw. For the duration, objects and affected creatures shed dim light in a 10-foot radius.","parents":["ttrpg:Spell"]},{"id":"dnd:FaithfulHound","label":"Faithful Hound","comment":"You conjure a phantom watchdog in an unoccupied space that you can see within range, where it remains for the duration, until you dismiss it as an action, or until you move more than 100 feet away from it.","parents":["ttrpg:Spell"]},{"id":"dnd:FalseLife","label":"False Life","comment":"Bolstering yourself with a necromantic facsimile of life, you gain 1d4 + 4 temporary hit points for the duration.","parents":["ttrpg:Spell"]},{"id":"dnd:Fear","label":"Fear","comment":"You project a phantasmal image of a creature's worst fears. Each creature in a 30-foot cone must succeed on a wisdom saving throw or drop whatever it is holding and become frightened for the duration.","parents":["ttrpg:Spell"]},{"id":"dnd:FeatherFall","label":"Feather Fall","comment":"Choose up to five falling creatures within range. A falling creature's rate of descent slows to 60 feet per round until the spell ends. If the creature lands before the spell ends, it takes no falling damage and can land on its feet, and the spell ends for that creature.","parents":["ttrpg:Spell"]},{"id":"dnd:Feeblemind","label":"Feeblemind","comment":"You blast the mind of a creature that you can see within range, attempting to shatter its intellect and personality. The target takes 4d6 psychic damage and must make an intelligence saving throw.","parents":["ttrpg:Spell"]},{"id":"dnd:FindFamiliar","label":"Find Familiar","comment":"You gain the service of a familiar, a spirit that takes an animal form you choose: bat, cat, crab, frog (toad), hawk, lizard, octopus, owl, poisonous snake, fish (quipper), rat, raven, sea horse, spider, or weasel. Appearing in an unoccupied space within range, the familiar has the statistics of the chosen form, though it is a celestial, fey, or fiend (your choice) instead of a beast.","parents":["ttrpg:Spell"]},{"id":"dnd:FindSteed","label":"Find Steed","comment":"You summon a spirit that assumes the form of an unusually intelligent, strong, and loyal steed, creating a long-lasting bond with it. Appearing in an unoccupied space within range, the steed takes on a form that you choose, such as a warhorse, a pony, a camel, an elk, or a mastiff. (Your DM might allow other animals to be summoned as steeds.) The steed has the statistics of the chosen form, though it is a celestial, fey, or fiend (your choice) instead of its normal type. Additionally, if your steed has an Intelligence of 5 or less, its Intelligence becomes 6, and it gains the ability to understand one language of your choice that you speak.","parents":["ttrpg:Spell"]},{"id":"dnd:FindThePath","label":"Find The Path","comment":"This spell allows you to find the shortest, most direct physical route to a specific fixed location that you are familiar with on the same plane of existence. If you name a destination on another plane of existence, a destination that moves (such as a mobile fortress), or a destination that isn't specific (such as a green dragon's lair), the spell fails.","parents":["ttrpg:Spell"]},{"id":"dnd:FindTraps","label":"Find Traps","comment":"You sense the presence of any trap within range that is within line of sight. A trap, for the purpose of this spell, includes anything that would inflict a sudden or unexpected effect you consider harmful or undesirable, which was specifically intended as such by its creator. Thus, the spell would sense an area affected by the alarm spell, a glyph of warding, or a mechanical pit trap, but it would not reveal a natural weakness in the floor, an unstable ceiling, or a hidden sinkhole.","parents":["ttrpg:Spell"]},{"id":"dnd:FingerOfDeath","label":"Finger Of Death","comment":"You send negative energy coursing through a creature that you can see within range, causing it searing pain. The target must make a constitution saving throw. It takes 7d8 + 30 necrotic damage on a failed save, or half as much damage on a successful one.","parents":["ttrpg:Spell"]},{"id":"dnd:FireBolt","label":"Fire Bolt","comment":"You hurl a mote of fire at a creature or object within range. Make a ranged spell attack against the target. On a hit, the target takes 1d10 fire damage. A flammable object hit by this spell ignites if it isn't being worn or carried.","parents":["ttrpg:Spell"]},{"id":"dnd:FireShield","label":"Fire Shield","comment":"Thin and vaporous flame surround your body for the duration of the spell, radiating a bright light bright light in a 10-foot radius and dim light for an additional 10 feet. You can end the spell using an action to make it disappear.","parents":["ttrpg:Spell"]},{"id":"dnd:FireStorm","label":"Fire Storm","comment":"A storm made up of sheets of roaring flame appears in a location you choose within range. The area of the storm consists of up to ten 10-foot cubes, which you can arrange as you wish. Each cube must have at least one face adjacent to the face of another cube. Each creature in the area must make a dexterity saving throw. It takes 7d10 fire damage on a failed save, or half as much damage on a successful one.","parents":["ttrpg:Spell"]},{"id":"dnd:Fireball","label":"Fireball","comment":"A bright streak flashes from your pointing finger to a point you choose within range and then blossoms with a low roar into an explosion of flame. Each creature in a 20-foot-radius sphere centered on that point must make a dexterity saving throw. A target takes 8d6 fire damage on a failed save, or half as much damage on a successful one.","parents":["ttrpg:Spell"]},{"id":"dnd:FlameBlade","label":"Flame Blade","comment":"You evoke a fiery blade in your free hand. The blade is similar in size and shape to a scimitar, and it lasts for the duration. If you let go of the blade, it disappears, but you can evoke the blade again as a bonus action.","parents":["ttrpg:Spell"]},{"id":"dnd:FlameStrike","label":"Flame Strike","comment":"A vertical column of divine fire roars down from the heavens in a location you specify. Each creature in a 10-foot-radius, 40-foot-high cylinder centered on a point within range must make a dexterity saving throw. A creature takes 4d6 fire damage and 4d6 radiant damage on a failed save, or half as much damage on a successful one.","parents":["ttrpg:Spell"]},{"id":"dnd:FlamingSphere","label":"Flaming Sphere","comment":"A 5-foot-diameter sphere of fire appears in an unoccupied space of your choice within range and lasts for the duration. Any creature that ends its turn within 5 feet of the sphere must make a dexterity saving throw. The creature takes 2d6 fire damage on a failed save, or half as much damage on a successful one.","parents":["ttrpg:Spell"]},{"id":"dnd:FleshToStone","label":"Flesh To Stone","comment":"You attempt to turn one creature that you can see within range into stone. If the target's body is made of flesh, the creature must make a constitution saving throw. On a failed save, it is restrained as its flesh begins to harden. On a successful save, the creature isn't affected.","parents":["ttrpg:Spell"]},{"id":"dnd:FloatingDisk","label":"Floating Disk","comment":"This spell creates a circular, horizontal plane of force, 3 feet in diameter and 1 inch thick, that floats 3 feet above the ground in an unoccupied space of your choice that you can see within range. The disk remains for the duration, and can hold up to 500 pounds. If more weight is placed on it, the spell ends, and everything on the disk falls to the ground.","parents":["ttrpg:Spell"]},{"id":"dnd:Fly","label":"Fly","comment":"You touch a willing creature. The target gains a flying speed of 60 feet for the duration. When the spell ends, the target falls if it is still aloft, unless it can stop the fall.","parents":["ttrpg:Spell"]},{"id":"dnd:FogCloud","label":"Fog Cloud","comment":"You create a 20-foot-radius sphere of fog centered on a point within range. The sphere spreads around corners, and its area is heavily obscured. It lasts for the duration or until a wind of moderate or greater speed (at least 10 miles per hour) disperses it.","parents":["ttrpg:Spell"]},{"id":"dnd:Forbiddance","label":"Forbiddance","comment":"You create a ward against magical travel that protects up to 40,000 square feet of floor space to a height of 30 feet above the floor. For the duration, creatures can't teleport into the area or use portals, such as those created by the gate spell, to enter the area. The spell proofs the area against planar travel, and therefore prevents creatures from accessing the area by way of the Astral Plane, Ethereal Plane, Feywild, Shadowfell, or the plane shift spell.","parents":["ttrpg:Spell"]},{"id":"dnd:Forcecage","label":"Forcecage","comment":"An immobile, invisible, cube-shaped prison composed of magical force springs into existence around an area you choose within range. The prison can be a cage or a solid box, as you choose.","parents":["ttrpg:Spell"]},{"id":"dnd:Foresight","label":"Foresight","comment":"You touch a willing creature and bestow a limited ability to see into the immediate future. For the duration, the target can't be surprised and has advantage on attack rolls, ability checks, and saving throws. Additionally, other creatures have disadvantage on attack rolls against the target for the duration.","parents":["ttrpg:Spell"]},{"id":"dnd:FreedomOfMovement","label":"Freedom Of Movement","comment":"You touch a willing creature. For the duration, the target's movement is unaffected by difficult terrain, and spells and other magical effects can neither reduce the target's speed nor cause the target to be paralyzed or restrained.","parents":["ttrpg:Spell"]},{"id":"dnd:FreezingSphere","label":"Freezing Sphere","comment":"A frigid globe of cold energy streaks from your fingertips to a point of your choice within range, where it explodes in a 60-foot-radius sphere. Each creature within the area must make a constitution saving throw. On a failed save, a creature takes 10d6 cold damage. On a successful save, it takes half as much damage.","parents":["ttrpg:Spell"]},{"id":"dnd:GaseousForm","label":"Gaseous Form","comment":"You transform a willing creature you touch, along with everything it's wearing and carrying, into a misty cloud for the duration. The spell ends if the creature drops to 0 hit points. An incorporeal creature isn't affected.","parents":["ttrpg:Spell"]},{"id":"dnd:Gate","label":"Gate","comment":"You conjure a portal linking an unoccupied space you can see within range to a precise location on a different plane of existence. The portal is a circular opening, which you can make 5 to 20 feet in diameter. You can orient the portal in any direction you choose. The portal lasts for the duration.","parents":["ttrpg:Spell"]},{"id":"dnd:Geas","label":"Geas","comment":"You place a magical command on a creature that you can see within range, forcing it to carry out some service or refrain from some action or course of activity as you decide. If the creature can understand you, it must succeed on a wisdom saving throw or become charmed by you for the duration. While the creature is charmed by you, it takes 5d10 psychic damage each time it acts in a manner directly counter to your instructions, but no more than once each day. A creature that can't understand you is unaffected by the spell.","parents":["ttrpg:Spell"]},{"id":"dnd:GentleRepose","label":"Gentle Repose","comment":"You touch a corpse or other remains. For the duration, the target is protected from decay and can't become undead.","parents":["ttrpg:Spell"]},{"id":"dnd:GiantInsect","label":"Giant Insect","comment":"You transform up to ten centipedes, three spiders, five wasps, or one scorpion within range into giant versions of their natural forms for the duration. A centipede becomes a giant centipede, a spider becomes a giant spider, a wasp becomes a giant wasp, and a scorpion becomes a giant scorpion.","parents":["ttrpg:Spell"]},{"id":"dnd:Glibness","label":"Glibness","comment":"Until the spell ends, when you make a Charisma check, you can replace the number you roll with a 15. Additionally, no matter what you say, magic that would determine if you are telling the truth indicates that you are being truthful.","parents":["ttrpg:Spell"]},{"id":"dnd:GlobeOfInvulnerability","label":"Globe Of Invulnerability","comment":"An immobile, faintly shimmering barrier springs into existence in a 10-foot radius around you and remains for the duration.","parents":["ttrpg:Spell"]},{"id":"dnd:GlyphOfWarding","label":"Glyph Of Warding","comment":"When you cast this spell, you inscribe a glyph that harms other creatures, either upon a surface (such as a table or a section of floor or wall) or within an object that can be closed (such as a book, a scroll, or a treasure chest) to conceal the glyph. If you choose a surface, the glyph can cover an area of the surface no larger than 10 feet in diameter. If you choose an object, that object must remain in its place; if the object is moved more than 10 feet from where you cast this spell, the glyph is broken, and the spell ends without being triggered.","parents":["ttrpg:Spell"]},{"id":"dnd:Goodberry","label":"Goodberry","comment":"Up to ten berries appear in your hand and are infused with magic for the duration. A creature can use its action to eat one berry. Eating a berry restores 1 hit point, and the berry provides enough nourishment to sustain a creature for a day.","parents":["ttrpg:Spell"]},{"id":"dnd:Grease","label":"Grease","comment":"Slick grease covers the ground in a 10-foot square centered on a point within range and turns it into difficult terrain for the duration.","parents":["ttrpg:Spell"]},{"id":"dnd:GreaterInvisibility","label":"Greater Invisibility","comment":"You or a creature you touch becomes invisible until the spell ends. Anything the target is wearing or carrying is invisible as long as it is on the target's person.","parents":["ttrpg:Spell"]},{"id":"dnd:GreaterRestoration","label":"Greater Restoration","comment":"You imbue a creature you touch with positive energy to undo a debilitating effect. You can reduce the target's exhaustion level by one, or end one of the following effects on the target:","parents":["ttrpg:Spell"]},{"id":"dnd:GuardianOfFaith","label":"Guardian Of Faith","comment":"A Large spectral guardian appears and hovers for the duration in an unoccupied space of your choice that you can see within range. The guardian occupies that space and is indistinct except for a gleaming sword and shield emblazoned with the symbol of your deity.","parents":["ttrpg:Spell"]},{"id":"dnd:GuardsAndWards","label":"Guards And Wards","comment":"You create a ward that protects up to 2,500 square feet of floor space (an area 50 feet square, or one hundred 5-foot squares or twenty-five 10-foot squares). The warded area can be up to 20 feet tall, and shaped as you desire. You can ward several stories of a stronghold by dividing the area among them, as long as you can walk into each contiguous area while you are casting the spell.","parents":["ttrpg:Spell"]},{"id":"dnd:Guidance","label":"Guidance","comment":"You touch one willing creature. Once before the spell ends, the target can roll a d4 and add the number rolled to one ability check of its choice. It can roll the die before or after making the ability check. The spell then ends.","parents":["ttrpg:Spell"]},{"id":"dnd:GuidingBolt","label":"Guiding Bolt","comment":"A flash of light streaks toward a creature of your choice within range. Make a ranged spell attack against the target. On a hit, the target takes 4d6 radiant damage, and the next attack roll made against this target before the end of your next turn has advantage, thanks to the mystical dim light glittering on the target until then.","parents":["ttrpg:Spell"]},{"id":"dnd:GustOfWind","label":"Gust Of Wind","comment":"A line of strong wind 60 feet long and 10 feet wide blasts from you in a direction you choose for the spell's duration. Each creature that starts its turn in the line must succeed on a strength saving throw or be pushed 15 feet away from you in a direction following the line.","parents":["ttrpg:Spell"]},{"id":"dnd:Hallow","label":"Hallow","comment":"You touch a point and infuse an area around it with holy (or unholy) power. The area can have a radius up to 60 feet, and the spell fails if the radius includes an area already under the effect a hallow spell. The affected area is subject to the following effects.","parents":["ttrpg:Spell"]},{"id":"dnd:HallucinatoryTerrain","label":"Hallucinatory Terrain","comment":"You make natural terrain in a 150-foot cube in range look, sound, and smell like some other sort of natural terrain. Thus, open fields or a road can be made to resemble a swamp, hill, crevasse, or some other difficult or impassable terrain. A pond can be made to seem like a grassy meadow, a precipice like a gentle slope, or a rock-strewn gully like a wide and smooth road. Manufactured structures, equipment, and creatures within the area aren't changed in appearance.","parents":["ttrpg:Spell"]},{"id":"dnd:Harm","label":"Harm","comment":"You unleash a virulent disease on a creature that you can see within range. The target must make a constitution saving throw. On a failed save, it takes 14d6 necrotic damage, or half as much damage on a successful save. The damage can't reduce the target's hit points below 1. If the target fails the saving throw, its hit point maximum is reduced for 1 hour by an amount equal to the necrotic damage it took. Any effect that removes a disease allows a creature's hit point maximum to return to normal before that time passes.","parents":["ttrpg:Spell"]},{"id":"dnd:Haste","label":"Haste","comment":"Choose a willing creature that you can see within range. Until the spell ends, the target's speed is doubled, it gains a +2 bonus to AC, it has advantage on dexterity saving throws, and it gains an additional action on each of its turns. That action can be used only to take the Attack (one weapon attack only), Dash, Disengage, Hide, or Use an Object action.","parents":["ttrpg:Spell"]},{"id":"dnd:Heal","label":"Heal","comment":"Choose a creature that you can see within range. A surge of positive energy washes through the creature, causing it to regain 70 hit points. This spell also ends blindness, deafness, and any diseases affecting the target. This spell has no effect on constructs or undead.","parents":["ttrpg:Spell"]},{"id":"dnd:HealingWord","label":"Healing Word","comment":"A creature of your choice that you can see within range regains hit points equal to 1d4 + your spellcasting ability modifier. This spell has no effect on undead or constructs.","parents":["ttrpg:Spell"]},{"id":"dnd:HeatMetal","label":"Heat Metal","comment":"Choose a manufactured metal object, such as a metal weapon or a suit of heavy or medium metal armor, that you can see within range. You cause the object to glow red-hot. Any creature in physical contact with the object takes 2d8 fire damage when you cast the spell. Until the spell ends, you can use a bonus action on each of your subsequent turns to cause this damage again.","parents":["ttrpg:Spell"]},{"id":"dnd:HellishRebuke","label":"Hellish Rebuke","comment":"You point your finger, and the creature that damaged you is momentarily surrounded by hellish flames. The creature must make a dexterity saving throw. It takes 2d10 fire damage on a failed save, or half as much damage on a successful one.","parents":["ttrpg:Spell"]},{"id":"dnd:HeroesFeast","label":"Heroes Feast","comment":"You bring forth a great feast, including magnificent food and drink. The feast takes 1 hour to consume and disappears at the end of that time, and the beneficial effects don't set in until this hour is over. Up to twelve other creatures can partake of the feast.","parents":["ttrpg:Spell"]},{"id":"dnd:Heroism","label":"Heroism","comment":"A willing creature you touch is imbued with bravery. Until the spell ends, the creature is immune to being frightened and gains temporary hit points equal to your spellcasting ability modifier at the start of each of its turns. When the spell ends, the target loses any remaining temporary hit points from this spell.","parents":["ttrpg:Spell"]},{"id":"dnd:HideousLaughter","label":"Hideous Laughter","comment":"A creature of your choice that you can see within range perceives everything as hilariously funny and falls into fits of laughter if this spell affects it. The target must succeed on a wisdom saving throw or fall prone, becoming incapacitated and unable to stand up for the duration. A creature with an Intelligence score of 4 or less isn't affected.","parents":["ttrpg:Spell"]},{"id":"dnd:HoldMonster","label":"Hold Monster","comment":"Choose a creature you can see and reach. The target must make a saving throw of Wisdom or be paralyzed for the duration of the spell. This spell has no effect against the undead. At the end of each round, the target can make a new saving throw of Wisdom. If successful, the spell ends for the creature.","parents":["ttrpg:Spell"]},{"id":"dnd:HoldPerson","label":"Hold Person","comment":"Choose a humanoid that you can see within range. The target must succeed on a wisdom saving throw or be paralyzed for the duration. At the end of each of its turns, the target can make another wisdom saving throw. On a success, the spell ends on the target.","parents":["ttrpg:Spell"]},{"id":"dnd:HolyAura","label":"Holy Aura","comment":"Divine light washes out from you and coalesces in a soft radiance in a 30-foot radius around you. Creatures of your choice in that radius when you cast this spell shed dim light in a 5-foot radius and have advantage on all saving throws, and other creatures have disadvantage on attack rolls against them until the spell ends. In addition, when a fiend or an undead hits an affected creature with a melee attack, the aura flashes with brilliant light. The attacker must succeed on a constitution saving throw or be blinded until the spell ends.","parents":["ttrpg:Spell"]},{"id":"dnd:HuntersMark","label":"Hunters Mark","comment":"You choose a creature you can see within range and mystically mark it as your quarry. Until the spell ends, you deal an extra 1d6 damage to the target whenever you hit it with a weapon attack, and you have advantage on any Wisdom (Perception) or Wisdom (Survival) check you make to find it. If the target drops to 0 hit points before this spell ends, you can use a bonus action on a subsequent turn of yours to mark a new creature.","parents":["ttrpg:Spell"]},{"id":"dnd:HypnoticPattern","label":"Hypnotic Pattern","comment":"You create a twisting pattern of colors that weaves through the air inside a 30-foot cube within range. The pattern appears for a moment and vanishes. Each creature in the area who sees the pattern must make a wisdom saving throw. On a failed save, the creature becomes charmed for the duration. While charmed by this spell, the creature is incapacitated and has a speed of 0.","parents":["ttrpg:Spell"]},{"id":"dnd:IceStorm","label":"Ice Storm","comment":"A hail of rock-hard ice pounds to the ground in a 20-foot-radius, 40-foot-high cylinder centered on a point within range. Each creature in the cylinder must make a dexterity saving throw. A creature takes 2d8 bludgeoning damage and 4d6 cold damage on a failed save, or half as much damage on a successful one.","parents":["ttrpg:Spell"]},{"id":"dnd:Identify","label":"Identify","comment":"You choose one object that you must touch throughout the casting of the spell. If it is a magic item or some other magic-imbued object, you learn its properties and how to use them, whether it requires attunement to use, and how many charges it has, if any. You learn whether any spells are affecting the item and what they are. If the item was created by a spell, you learn which spell created it.","parents":["ttrpg:Spell"]},{"id":"dnd:IllusoryScript","label":"Illusory Script","comment":"You write on parchment, paper, or some other suitable writing material and imbue it with a potent illusion that lasts for the duration.","parents":["ttrpg:Spell"]},{"id":"dnd:Imprisonment","label":"Imprisonment","comment":"You create a magical restraint to hold a creature that you can see within range. The target must succeed on a wisdom saving throw or be bound by the spell; if it succeeds, it is immune to this spell if you cast it again. While affected by this spell, the creature doesn't need to breathe, eat, or drink, and it doesn't age. Divination spells can't locate or perceive the target.","parents":["ttrpg:Spell"]},{"id":"dnd:IncendiaryCloud","label":"Incendiary Cloud","comment":"A swirling cloud of smoke shot through with white-hot embers appears in a 20-foot-radius sphere centered on a point within range. The cloud spreads around corners and is heavily obscured. It lasts for the duration or until a wind of moderate or greater speed (at least 10 miles per hour) disperses it.","parents":["ttrpg:Spell"]},{"id":"dnd:InflictWounds","label":"Inflict Wounds","comment":"Make a melee spell attack against a creature you can reach. On a hit, the target takes 3d10 necrotic damage.","parents":["ttrpg:Spell"]},{"id":"dnd:InsectPlague","label":"Insect Plague","comment":"Swarming, biting locusts fill a 20-foot-radius sphere centered on a point you choose within range. The sphere spreads around corners. The sphere remains for the duration, and its area is lightly obscured. The sphere's area is difficult terrain.","parents":["ttrpg:Spell"]},{"id":"dnd:InstantSummons","label":"Instant Summons","comment":"You touch an object weighing 10 pounds or less whose longest dimension is 6 feet or less. The spell leaves an invisible mark on its surface and invisibly inscribes the name of the item on the sapphire you use as the material component. Each time you cast this spell, you must use a different sapphire.","parents":["ttrpg:Spell"]},{"id":"dnd:Invisibility","label":"Invisibility","comment":"A creature you touch becomes invisible until the spell ends. Anything the target is wearing or carrying is invisible as long as it is on the target's person. The spell ends for a target that attacks or casts a spell.","parents":["ttrpg:Spell"]},{"id":"dnd:IrresistibleDance","label":"Irresistible Dance","comment":"Choose one creature that you can see within range. The target begins a comic dance in place: shuffling, tapping its feet, and capering for the duration. Creatures that can't be charmed are immune to this spell.","parents":["ttrpg:Spell"]},{"id":"dnd:Jump","label":"Jump","comment":"You touch a creature. The creature's jump distance is tripled until the spell ends.","parents":["ttrpg:Spell"]},{"id":"dnd:Knock","label":"Knock","comment":"Choose an object that you can see within range. The object can be a door, a box, a chest, a set of manacles, a padlock, or another object that contains a mundane or magical means that prevents access.","parents":["ttrpg:Spell"]},{"id":"dnd:LegendLore","label":"Legend Lore","comment":"Name or describe a person, place, or object. The spell brings to your mind a brief summary of the significant lore about the thing you named. The lore might consist of current tales, forgotten stories, or even secret lore that has never been widely known. If the thing you named isn't of legendary importance, you gain no information. The more information you already have about the thing, the more precise and detailed the information you receive is.","parents":["ttrpg:Spell"]},{"id":"dnd:LesserRestoration","label":"Lesser Restoration","comment":"You touch a creature and can end either one disease or one condition afflicting it. The condition can be blinded, deafened, paralyzed, or poisoned.","parents":["ttrpg:Spell"]},{"id":"dnd:Levitate","label":"Levitate","comment":"One creature or object of your choice that you can see within range rises vertically, up to 20 feet, and remains suspended there for the duration. The spell can levitate a target that weighs up to 500 pounds. An unwilling creature that succeeds on a constitution saving throw is unaffected.","parents":["ttrpg:Spell"]},{"id":"dnd:Light","label":"Light","comment":"You touch one object that is no larger than 10 feet in any dimension. Until the spell ends, the object sheds bright light in a 20-foot radius and dim light for an additional 20 feet. The light can be colored as you like. Completely covering the object with something opaque blocks the light. The spell ends if you cast it again or dismiss it as an action.","parents":["ttrpg:Spell"]},{"id":"dnd:LightningBolt","label":"Lightning Bolt","comment":"A stroke of lightning forming a line 100 feet long and 5 feet wide blasts out from you in a direction you choose. Each creature in the line must make a dexterity saving throw. A creature takes 8d6 lightning damage on a failed save, or half as much damage on a successful one.","parents":["ttrpg:Spell"]},{"id":"dnd:LocateAnimalsOrPlants","label":"Locate Animals Or Plants","comment":"Describe or name a specific kind of beast or plant. Concentrating on the voice of nature in your surroundings, you learn the direction and distance to the closest creature or plant of that kind within 5 miles, if any are present.","parents":["ttrpg:Spell"]},{"id":"dnd:LocateCreature","label":"Locate Creature","comment":"Describe or name a creature that is familiar to you. You sense the direction to the creature's location, as long as that creature is within 1,000 feet of you. If the creature is moving, you know the direction of its movement.","parents":["ttrpg:Spell"]},{"id":"dnd:LocateObject","label":"Locate Object","comment":"Describe or name an object that is familiar to you. You sense the direction to the object's location, as long as that object is within 1,000 feet of you. If the object is in motion, you know the direction of its movement.","parents":["ttrpg:Spell"]},{"id":"dnd:Longstrider","label":"Longstrider","comment":"You touch a creature. The target's speed increases by 10 feet until the spell ends.","parents":["ttrpg:Spell"]},{"id":"dnd:MageArmor","label":"Mage Armor","comment":"You touch a willing creature who isn't wearing armor, and a protective magical force surrounds it until the spell ends. The target's base AC becomes 13 + its Dexterity modifier. The spell ends if the target dons armor or if you dismiss the spell as an action.","parents":["ttrpg:Spell"]},{"id":"dnd:MageHand","label":"Mage Hand","comment":"A spectral, floating hand appears at a point you choose within range. The hand lasts for the duration or until you dismiss it as an action. The hand vanishes if it is ever more than 30 feet away from you or if you cast this spell again.","parents":["ttrpg:Spell"]},{"id":"dnd:MagicCircle","label":"Magic Circle","comment":"You create a 10-foot radius, 20-foot-tall cylinder of magical energy centered on a point on the ground that you can see within range. Glowing runes appear whetever the cylinder intersects with the floor or other surface.","parents":["ttrpg:Spell"]},{"id":"dnd:MagicJar","label":"Magic Jar","comment":"Your body falls into a catatonic state as your soul leaves it and enters the container you used for the spell's material component. While your soul inhabits the container, you are aware of your surroundings as if you were in the container's space. You can't move or use reactions. The only action you can take is to project your soul up to 100 feet out of the container, either returning to your living body (and ending the spell) or attempting to possess a humanoids body.","parents":["ttrpg:Spell"]},{"id":"dnd:MagicMissile","label":"Magic Missile","comment":"You create three glowing darts of magical force. Each dart hits a creature of your choice that you can see within range. A dart deals 1d4 + 1 force damage to its target. The darts all strike simultaneously, and you can direct them to hit one creature or several.","parents":["ttrpg:Spell"]},{"id":"dnd:MagicMouth","label":"Magic Mouth","comment":"You plant a message to an object in the range of the spell. The message is verbalized when the trigger conditions are met. Choose an object that you see, and that is not worn or carried by another creature. Then say the message, which should not exceed 25 words but listening can take up to 10 minutes. Finally, establish the circumstances that trigger the spell to deliver your message.","parents":["ttrpg:Spell"]},{"id":"dnd:MagicWeapon","label":"Magic Weapon","comment":"You touch a nonmagical weapon. Until the spell ends, that weapon becomes a magic weapon with a +1 bonus to attack rolls and damage rolls.","parents":["ttrpg:Spell"]},{"id":"dnd:MagnificentMansion","label":"Magnificent Mansion","comment":"You conjure an extradimensional dwelling in range that lasts for the duration. You choose where its one entrance is located. The entrance shimmers faintly and is 5 feet wide and 10 feet tall. You and any creature you designate when you cast the spell can enter the extradimensional dwelling as long as the portal remains open. You can open or close the portal if you are within 30 feet of it. While closed, the portal is invisible.","parents":["ttrpg:Spell"]},{"id":"dnd:MajorImage","label":"Major Image","comment":"You create the image of an object, a creature, or some other visible phenomenon that is no larger than a 20-foot cube. The image appears at a spot that you can see within range and lasts for the duration. It seems completely real, including sounds, smells, and temperature appropriate to the thing depicted. You can't create sufficient heat or cold to cause damage, a sound loud enough to deal thunder damage or deafen a creature, or a smell that might sicken a creature (like a troglodyte's stench).","parents":["ttrpg:Spell"]},{"id":"dnd:MassCureWounds","label":"Mass Cure Wounds","comment":"A wave of healing energy washes out from a point of your choice within range. Choose up to six creatures in a 30-foot-radius sphere centered on that point. Each target regains hit points equal to 3d8 + your spellcasting ability modifier. This spell has no effect on undead or constructs.","parents":["ttrpg:Spell"]},{"id":"dnd:MassHeal","label":"Mass Heal","comment":"A flood of healing energy flows from you into injured creatures around you. You restore up to 700 hit points, divided as you choose among any number of creatures that you can see within range. Creatures healed by this spell are also cured of all diseases and any effect making them blinded or deafened. This spell has no effect on undead or constructs.","parents":["ttrpg:Spell"]},{"id":"dnd:MassHealingWord","label":"Mass Healing Word","comment":"As you call out words of restoration, up to six creatures of your choice that you can see within range regain hit points equal to 1d4 + your spellcasting ability modifier. This spell has no effect on undead or constructs.","parents":["ttrpg:Spell"]},{"id":"dnd:MassSuggestion","label":"Mass Suggestion","comment":"You suggest a course of activity (limited to a sentence or two) and magically influence up to twelve creatures of your choice that you can see within range and that can hear and understand you. Creatures that can't be charmed are immune to this effect. The suggestion must be worded in such a manner as to make the course of action sound reasonable. Asking the creature to stab itself, throw itself onto a spear, immolate itself, or do some other obviously harmful act automatically negates the effect of the spell.","parents":["ttrpg:Spell"]},{"id":"dnd:Maze","label":"Maze","comment":"You banish a creature that you can see within range into a labyrinthine demiplane. The target remains there for the duration or until it escapes the maze.","parents":["ttrpg:Spell"]},{"id":"dnd:MeldIntoStone","label":"Meld Into Stone","comment":"You step into a stone object or surface large enough to fully contain your body, melding yourself and all the equipment you carry with the stone for the duration. Using your movement, you step into the stone at a point you can touch. Nothing of your presence remains visible or otherwise detectable by nonmagical senses.","parents":["ttrpg:Spell"]},{"id":"dnd:Mending","label":"Mending","comment":"This spell repairs a single break or tear in an object you touch, such as a broken key, a torn cloak, or a leaking wineskin. As long as the break or tear is no longer than 1 foot in any dimension, you mend it, leaving no trace of the former damage.","parents":["ttrpg:Spell"]},{"id":"dnd:Message","label":"Message","comment":"You point your finger toward a creature within range and whisper a message. The target (and only the target) hears the message and can reply in a whisper that only you can hear.","parents":["ttrpg:Spell"]},{"id":"dnd:MeteorSwarm","label":"Meteor Swarm","comment":"Blazing orbs of fire plummet to the ground at four different points you can see within range. Each creature in a 40-foot-radius sphere centered on each point you choose must make a dexterity saving throw. The sphere spreads around corners. A creature takes 20d6 fire damage and 20d6 bludgeoning damage on a failed save, or half as much damage on a successful one. A creature in the area of more than one fiery burst is affected only once.","parents":["ttrpg:Spell"]},{"id":"dnd:MindBlank","label":"Mind Blank","comment":"Until the spell ends, one willing creature you touch is immune to psychic damage, any effect that would sense its emotions or read its thoughts, divination spells, and the charmed condition. The spell even foils wish spells and spells or effects of similar power used to affect the target's mind or to gain information about the target.","parents":["ttrpg:Spell"]},{"id":"dnd:MinorIllusion","label":"Minor Illusion","comment":"You create a sound or an image of an object within range that lasts for the duration. The illusion also ends if you dismiss it as an action or cast this spell again.","parents":["ttrpg:Spell"]},{"id":"dnd:MirageArcane","label":"Mirage Arcane","comment":"You make terrain in an area up to 1 mile square look, sound, smell, and even feel like some other sort of terrain. The terrain's general shape remains the same, however. Open fields or a road could be made to resemble a swamp, hill, crevasse, or some other difficult or impassable terrain. A pond can be made to seem like a grassy meadow, a precipice like a gentle slope, or a rock-strewn gully like a wide and smooth road.","parents":["ttrpg:Spell"]},{"id":"dnd:MirrorImage","label":"Mirror Image","comment":"Three illusory duplicates of yourself appear in your space. Until the spell ends, the duplicates move with you and mimic your actions, shifting position so it's impossible to track which image is real. You can use your action to dismiss the illusory duplicates.","parents":["ttrpg:Spell"]},{"id":"dnd:Mislead","label":"Mislead","comment":"You become invisible at the same time that an illusory double of you appears where you are standing. The double lasts for the duration, but the invisibility ends if you attack or cast a spell.","parents":["ttrpg:Spell"]},{"id":"dnd:MistyStep","label":"Misty Step","comment":"Briefly surrounded by silvery mist, you teleport up to 30 feet to an unoccupied space that you can see.","parents":["ttrpg:Spell"]},{"id":"dnd:ModifyMemory","label":"Modify Memory","comment":"You attempt to reshape another creature's memories. One creature that you can see must make a wisdom saving throw. If you are fighting the creature, it has advantage on the saving throw. On a failed save, the target becomes charmed by you for the duration. The charmed target is incapacitated and unaware of its surroundings, though it can still hear you. If it takes any damage or is targeted by another spell, this spell ends, and none of the target's memories are modified.","parents":["ttrpg:Spell"]},{"id":"dnd:Moonbeam","label":"Moonbeam","comment":"A silvery beam of pale light shines down in a 5-foot radius, 40-foot-high cylinder centered on a point within range. Until the spell ends, dim light fills the cylinder.","parents":["ttrpg:Spell"]},{"id":"dnd:MoveEarth","label":"Move Earth","comment":"Choose an area of terrain no larger than 40 feet on a side within range. You can reshape dirt, sand, or clay in the area in any manner you choose for the duration. You can raise or lower the area's elevation, create or fill in a trench, erect or flatten a wall, or form a pillar. The extent of any such changes can't exceed half the area's largest dimension. So, if you affect a 40-foot square, you can create a pillar up to 20 feet high, raise or lower the square's elevation by up to 20 feet, dig a trench up to 20 feet deep, and so on. It takes 10 minutes for these changes to complete.","parents":["ttrpg:Spell"]},{"id":"dnd:Nondetection","label":"Nondetection","comment":"For the duration, you hide a target that you touch from divination magic. The target can be a willing creature or a place or an object no larger than 10 feet in any dimension. The target can't be targeted by any divination magic or perceived through magical scrying sensors.","parents":["ttrpg:Spell"]},{"id":"dnd:PassWithoutTrace","label":"Pass Without Trace","comment":"A veil of shadows and silence radiates from you, masking you and your companions from detection. For the duration, each creature you choose within 30 feet of you (including you) has a +10 bonus to Dexterity (Stealth) checks and can't be tracked except by magical means. A creature that receives this bonus leaves behind no tracks or other traces of its passage.","parents":["ttrpg:Spell"]},{"id":"dnd:Passwall","label":"Passwall","comment":"A passage appears at a point of your choice that you can see on a wooden, plaster, or stone surface (such as a wall, a ceiling, or a floor) within range, and lasts for the duration. You choose the opening's dimensions: up to 5 feet wide, 8 feet tall, and 20 feet deep. The passage creates no instability in a structure surrounding it.","parents":["ttrpg:Spell"]},{"id":"dnd:PhantasmalKiller","label":"Phantasmal Killer","comment":"You tap into the nightmares of a creature you can see within range and create an illusory manifestation of its deepest fears, visible only to that creature. The target must make a wisdom saving throw. On a failed save, the target becomes frightened for the duration. At the start of each of the target's turns before the spell ends, the target must succeed on a wisdom saving throw or take 4d10 psychic damage. On a successful save, the spell ends.","parents":["ttrpg:Spell"]},{"id":"dnd:PhantomSteed","label":"Phantom Steed","comment":"A Large quasi-real, horselike creature appears on the ground in an unoccupied space of your choice within range. You decide the creature's appearance, but it is equipped with a saddle, bit, and bridle. Any of the equipment created by the spell vanishes in a puff of smoke if it is carried more than 10 feet away from the steed.","parents":["ttrpg:Spell"]},{"id":"dnd:PlanarAlly","label":"Planar Ally","comment":"You beseech an otherworldly entity for aid. The being must be known to you: a god, a primordial, a demon prince, or some other being of cosmic power. That entity sends a celestial, an elemental, or a fiend loyal to it to aid you, making the creature appear in an unoccupied space within range. If you know a specific creature's name, you can speak that name when you cast this spell to request that creature, though you might get a different creature anyway (DM's choice).","parents":["ttrpg:Spell"]},{"id":"dnd:PlanarBinding","label":"Planar Binding","comment":"With this spell, you attempt to bind a celestial, an elemental, a fey, or a fiend to your service. The creature must be within range for the entire casting of the spell. (Typically, the creature is first summoned into the center of an inverted magic circle in order to keep it trapped while this spell is cast.) At the completion of the casting, the target must make a charisma saving throw. On a failed save, it is bound to serve you for the duration. If the creature was summoned or created by another spell, that spell's duration is extended to match the duration of this spell.","parents":["ttrpg:Spell"]},{"id":"dnd:PlaneShift","label":"Plane Shift","comment":"You and up to eight willing creatures who link hands in a circle are transported to a different plane of existence. You can specify a target destination in general terms, such as the City of Brass on the Elemental Plane of Fire or the palace of Dispater on the second level of the Nine Hells, and you appear in or near that destination. If you are trying to reach the City of Brass, for example, you might arrive in its Street of Steel, before its Gate of Ashes, or looking at the city from across the Sea of Fire, at the DM's discretion.","parents":["ttrpg:Spell"]},{"id":"dnd:PlantGrowth","label":"Plant Growth","comment":"This spell channels vitality into plants within a specific area. There are two possible uses for the spell, granting either immediate or long-term benefits.","parents":["ttrpg:Spell"]},{"id":"dnd:PoisonSpray","label":"Poison Spray","comment":"You extend your hand toward a creature you can see within range and project a puff of noxious gas from your palm. The creature must succeed on a constitution saving throw or take 1d12 poison damage.","parents":["ttrpg:Spell"]},{"id":"dnd:Polymorph","label":"Polymorph","comment":"This spell transforms a creature that you can see within range into a new form. An unwilling creature must make a wisdom saving throw to avoid the effect. A shapechanger automatically succeeds on this saving throw.","parents":["ttrpg:Spell"]},{"id":"dnd:PowerWordKill","label":"Power Word Kill","comment":"You utter a word of power that can compel one creature you can see within range to die instantly. If the creature you choose has 100 hit points or fewer, it dies. Otherwise, the spell has no effect.","parents":["ttrpg:Spell"]},{"id":"dnd:PowerWordStun","label":"Power Word Stun","comment":"You speak a word of power that can overwhelm the mind of one creature you can see within range, leaving it dumbfounded. If the target has 150 hit points or fewer, it is stunned. Otherwise, the spell has no effect.","parents":["ttrpg:Spell"]},{"id":"dnd:PrayerOfHealing","label":"Prayer Of Healing","comment":"Up to six creatures of your choice that you can see within range each regain hit points equal to 2d8 + your spellcasting ability modifier. This spell has no effect on undead or constructs.","parents":["ttrpg:Spell"]},{"id":"dnd:Prestidigitation","label":"Prestidigitation","comment":"This spell is a minor magical trick that novice spellcasters use for practice. You create one of the following magical effects within 'range':","parents":["ttrpg:Spell"]},{"id":"dnd:PrismaticSpray","label":"Prismatic Spray","comment":"Eight multicolored rays of light flash from your hand. Each ray is a different color and has a different power and purpose. Each creature in a 60-foot cone must make a dexterity saving throw. For each target, roll a d8 to determine which color ray affects it.","parents":["ttrpg:Spell"]},{"id":"dnd:PrismaticWall","label":"Prismatic Wall","comment":"A shimmering, multicolored plane of light forms a vertical opaque wall--up to 90 feet long, 30 feet high, and 1 inch thick--centered on a point you can see within range. Alternatively, you can shape the wall into a sphere up to 30 feet in diameter centered on a point you choose within range. The wall remains in place for the duration. If you position the wall so that it passes through a space occupied by a creature, the spell fails, and your action and the spell slot are wasted.","parents":["ttrpg:Spell"]},{"id":"dnd:PrivateSanctum","label":"Private Sanctum","comment":"You make an area within range magically secure. The area is a cube that can be as small as 5 feet to as large as 100 feet on each side. The spell lasts for the duration or until you use an action to dismiss it.","parents":["ttrpg:Spell"]},{"id":"dnd:ProduceFlame","label":"Produce Flame","comment":"A flickering flame appears in your hand. The flame remains there for the duration and harms neither you nor your equipment. The flame sheds bright light in a 10-foot radius and dim light for an additional 10 feet. The spell ends if you dismiss it as an action or if you cast it again.","parents":["ttrpg:Spell"]},{"id":"dnd:ProgrammedIllusion","label":"Programmed Illusion","comment":"You create an illusion of an object, a creature, or some other visible phenomenon within range that activates when a specific condition occurs. The illusion is imperceptible until then. It must be no larger than a 30-foot cube, and you decide when you cast the spell how the illusion behaves and what sounds it makes. This scripted performance can last up to 5 minutes.","parents":["ttrpg:Spell"]},{"id":"dnd:ProjectImage","label":"Project Image","comment":"You create an illusory copy of yourself that lasts for the duration. The copy can appear at any location within range that you have seen before, regardless of intervening obstacles. The illusion looks and sounds like you but is intangible. If the illusion takes any damage, it disappears, and the spell ends.","parents":["ttrpg:Spell"]},{"id":"dnd:ProtectionFromEnergy","label":"Protection From Energy","comment":"For the duration, the willing creature you touch has resistance to one damage type of your choice: acid, cold, fire, lightning, or thunder.","parents":["ttrpg:Spell"]},{"id":"dnd:ProtectionFromEvilAndGood","label":"Protection From Evil And Good","comment":"Until the spell ends, one willing creature you touch is protected against certain types of creatures: aberrations, celestials, elementals, fey, fiends, and undead.","parents":["ttrpg:Spell"]},{"id":"dnd:ProtectionFromPoison","label":"Protection From Poison","comment":"You touch a creature. If it is poisoned, you neutralize the poison. If more than one poison afflicts the target, you neutralize one poison that you know is present, or you neutralize one at random.","parents":["ttrpg:Spell"]},{"id":"dnd:PurifyFoodAndDrink","label":"Purify Food And Drink","comment":"All nonmagical food and drink within a 5-foot radius sphere centered on a point of your choice within range is purified and rendered free of poison and disease.","parents":["ttrpg:Spell"]},{"id":"dnd:RaiseDead","label":"Raise Dead","comment":"You return a dead creature you touch to life, provided that it has been dead no longer than 10 days. If the creature's soul is both willing and at liberty to rejoin the body, the creature returns to life with 1 hit point.","parents":["ttrpg:Spell"]},{"id":"dnd:RayOfEnfeeblement","label":"Ray Of Enfeeblement","comment":"A black beam of enervating energy springs from your finger toward a creature within range. Make a ranged spell attack against the target. On a hit, the target deals only half damage with weapon attacks that use Strength until the spell ends.","parents":["ttrpg:Spell"]},{"id":"dnd:RayOfFrost","label":"Ray Of Frost","comment":"A frigid beam of blue-white light streaks toward a creature within range. Make a ranged spell attack against the target. On a hit, it takes 1d8 cold damage, and its speed is reduced by 10 feet until the start of your next turn.","parents":["ttrpg:Spell"]},{"id":"dnd:Regenerate","label":"Regenerate","comment":"You touch a creature and stimulate its natural healing ability. The target regains 4d8 + 15 hit points. For the duration of the spell, the target regains 1 hit point at the start of each of its turns (10 hit points each minute).","parents":["ttrpg:Spell"]},{"id":"dnd:Reincarnate","label":"Reincarnate","comment":"You touch a dead humanoid or a piece of a dead humanoid. Provided that the creature has been dead no longer than 10 days, the spell forms a new adult body for it and then calls the soul to enter that body. If the target's soul isn't free or willing to do so, the spell fails.","parents":["ttrpg:Spell"]},{"id":"dnd:RemoveCurse","label":"Remove Curse","comment":"At your touch, all curses affecting one creature or object end. If the object is a cursed magic item, its curse remains, but the spell breaks its owner's attunement to the object so it can be removed or discarded.","parents":["ttrpg:Spell"]},{"id":"dnd:ResilientSphere","label":"Resilient Sphere","comment":"A sphere of shimmering force encloses a creature or object of Large size or smaller within range. An unwilling creature must make a dexterity saving throw. On a failed save, the creature is enclosed for the duration.","parents":["ttrpg:Spell"]},{"id":"dnd:Resistance","label":"Resistance","comment":"You touch one willing creature. Once before the spell ends, the target can roll a d4 and add the number rolled to one saving throw of its choice. It can roll the die before or after making the saving throw. The spell then ends.","parents":["ttrpg:Spell"]},{"id":"dnd:Resurrection","label":"Resurrection","comment":"You touch a dead creature that has been dead for no more than a century, that didn't die of old age, and that isn't undead. If its soul is free and willing, the target returns to life with all its hit points.","parents":["ttrpg:Spell"]},{"id":"dnd:ReverseGravity","label":"Reverse Gravity","comment":"This spell reverses gravity in a 50-foot-radius, 100-foot high cylinder centered on a point within range. All creatures and objects that aren't somehow anchored to the ground in the area fall upward and reach the top of the area when you cast this spell. A creature can make a dexterity saving throw to grab onto a fixed object it can reach, thus avoiding the fall.","parents":["ttrpg:Spell"]},{"id":"dnd:Revivify","label":"Revivify","comment":"You touch a creature that has died within the last minute. That creature returns to life with 1 hit point. This spell can't return to life a creature that has died of old age, nor can it restore any missing body parts.","parents":["ttrpg:Spell"]},{"id":"dnd:RopeTrick","label":"Rope Trick","comment":"You touch a length of rope that is up to 60 feet long. One end of the rope then rises into the air until the whole rope hangs perpendicular to the ground. At the upper end of the rope, an invisible entrance opens to an extradimensional space that lasts until the spell ends.","parents":["ttrpg:Spell"]},{"id":"dnd:SacredFlame","label":"Sacred Flame","comment":"Flame-like radiance descends on a creature that you can see within range. The target must succeed on a dexterity saving throw or take 1d8 radiant damage. The target gains no benefit from cover for this saving throw.","parents":["ttrpg:Spell"]},{"id":"dnd:Sanctuary","label":"Sanctuary","comment":"You ward a creature within range against attack. Until the spell ends, any creature who targets the warded creature with an attack or a harmful spell must first make a wisdom saving throw. On a failed save, the creature must choose a new target or lose the attack or spell. This spell doesn't protect the warded creature from area effects, such as the explosion of a fireball.","parents":["ttrpg:Spell"]},{"id":"dnd:ScorchingRay","label":"Scorching Ray","comment":"You create three rays of fire and hurl them at targets within range. You can hurl them at one target or several.","parents":["ttrpg:Spell"]},{"id":"dnd:Scrying","label":"Scrying","comment":"You can see and hear a particular creature you choose that is on the same plane of existence as you. The target must make a wisdom saving throw, which is modified by how well you know the target and the sort of physical connection you have to it. If a target knows you're casting this spell, it can fail the saving throw voluntarily if it wants to be observed.","parents":["ttrpg:Spell"]},{"id":"dnd:SecretChest","label":"Secret Chest","comment":"You hide a chest, and all its contents, on the Ethereal Plane. You must touch the chest and the miniature replica that serves as a material component for the spell. The chest can contain up to 12 cubic feet of nonliving material (3 feet by 2 feet by 2 feet).","parents":["ttrpg:Spell"]},{"id":"dnd:SeeInvisibility","label":"See Invisibility","comment":"For the duration of the spell, you see invisible creatures and objects as if they were visible, and you can see through Ethereal. The ethereal objects and creatures appear ghostly translucent.","parents":["ttrpg:Spell"]},{"id":"dnd:Seeming","label":"Seeming","comment":"This spell allows you to change the appearance of any number of creatures that you can see within range. You give each target you choose a new, illusory appearance. An unwilling target can make a charisma saving throw, and if it succeeds, it is unaffected by this spell.","parents":["ttrpg:Spell"]},{"id":"dnd:Sending","label":"Sending","comment":"You send a short message of twenty-five words or less to a creature with which you are familiar. The creature hears the message in its mind, recognizes you as the sender if it knows you, and can answer in a like manner immediately. The spell enables creatures with Intelligence scores of at least 1 to understand the meaning of your message.","parents":["ttrpg:Spell"]},{"id":"dnd:Sequester","label":"Sequester","comment":"By means of this spell, a willing creature or an object can be hidden away, safe from detection for the duration. When you cast the spell and touch the target, it becomes invisible and can't be targeted by divination spells or perceived through scrying sensors created by divination spells.","parents":["ttrpg:Spell"]},{"id":"dnd:Shapechange","label":"Shapechange","comment":"You assume the form of a different creature for the duration. The new form can be of any creature with a challenge rating equal to your level or lower. The creature can't be a construct or an undead, and you must have seen the sort of creature at least once. You transform into an average example of that creature, one without any class levels or the Spellcasting trait.","parents":["ttrpg:Spell"]},{"id":"dnd:Shatter","label":"Shatter","comment":"A strong resonant sound painfully intense sounds of a desired point in the range of the spell. Each creature has a sphere with a 10-foot-radius sphere centered on that point must make a constitution saving throw or it suffers 3d8 thunder damage. If successful, the damage is halved. A creature made of inorganic materials such as stone, crystal or metal, makes its saving throw with a disadvantage.","parents":["ttrpg:Spell"]},{"id":"dnd:ShieldOfFaith","label":"Shield Of Faith","comment":"A shimmering field appears and surrounds a creature of your choice within range, granting it a +2 bonus to AC for the duration.","parents":["ttrpg:Spell"]},{"id":"dnd:Shillelagh","label":"Shillelagh","comment":"The wood of a club or a quarterstaff you are holding is imbued with nature's power. For the duration, you can use your spellcasting ability instead of Strength for the attack and damage rolls of melee attacks using that weapon, and the weapon's damage die becomes a d8. The weapon also becomes magical, if it isn't already. The spell ends if you cast it again or if you let go of the weapon.","parents":["ttrpg:Spell"]},{"id":"dnd:ShockingGrasp","label":"Shocking Grasp","comment":"Lightning springs from your hand to deliver a shock to a creature you try to touch. Make a melee spell attack against the target. You have advantage on the attack roll if the target is wearing armor made of metal. On a hit, the target takes 1d8 lightning damage, and it can't take reactions until the start of its next turn.","parents":["ttrpg:Spell"]},{"id":"dnd:Silence","label":"Silence","comment":"For the duration, no sound can be created within or pass through a 20-foot-radius sphere centered on a point you choose within range. Any creature or object entirely inside the sphere is immune to thunder damage, and creatures are deafened while entirely inside it.","parents":["ttrpg:Spell"]},{"id":"dnd:SilentImage","label":"Silent Image","comment":"You create the image of an object, a creature, or some other visible phenomenon that is no larger than a 15-foot cube. The image appears at a spot within range and lasts for the duration. The image is purely visual; it isn't accompanied by sound, smell, or other sensory effects.","parents":["ttrpg:Spell"]},{"id":"dnd:Simulacrum","label":"Simulacrum","comment":"You shape an illusory duplicate of one beast or humanoid that is within range for the entire casting time of the spell. The duplicate is a creature, partially real and formed from ice or snow, and it can take actions and otherwise be affected as a normal creature. It appears to be the same as the original, but it has half the creature's hit point maximum and is formed without any equipment. Otherwise, the illusion uses all the statistics of the creature it duplicates.","parents":["ttrpg:Spell"]},{"id":"dnd:Sleep","label":"Sleep","comment":"This spell sends creatures into a magical slumber. Roll 5d8; the total is how many hit points of creatures this spell can affect. Creatures within 20 feet of a point you choose within range are affected in ascending order of their current hit points (ignoring unconscious creatures).","parents":["ttrpg:Spell"]},{"id":"dnd:SleetStorm","label":"Sleet Storm","comment":"Until the spell ends, freezing rain and sleet fall in a 20-foot-tall cylinder with a 40-foot radius centered on a point you choose within range. The area is heavily obscured, and exposed flames in the area are doused.","parents":["ttrpg:Spell"]},{"id":"dnd:Slow","label":"Slow","comment":"You alter time around up to six creatures of your choice in a 40-foot cube within range. Each target must succeed on a wisdom saving throw or be affected by this spell for the duration.","parents":["ttrpg:Spell"]},{"id":"dnd:SpareTheDying","label":"Spare The Dying","comment":"You touch a living creature that has 0 hit points. The creature becomes stable. This spell has no effect on undead or constructs.","parents":["ttrpg:Spell"]},{"id":"dnd:SpeakWithAnimals","label":"Speak With Animals","comment":"You gain the ability to comprehend and verbally communicate with beasts for the duration. The knowledge and awareness of many beasts is limited by their intelligence, but at a minimum, beasts can give you information about nearby locations and monsters, including whatever they can perceive or have perceived within the past day. You might be able to persuade a beast to perform a small favor for you, at the DM's discretion.","parents":["ttrpg:Spell"]},{"id":"dnd:SpeakWithDead","label":"Speak With Dead","comment":"You grant the semblance of life and intelligence to a corpse of your choice within range, allowing it to answer the questions you pose. The corpse must still have a mouth and can't be undead. The spell fails if the corpse was the target of this spell within the last 10 days.","parents":["ttrpg:Spell"]},{"id":"dnd:SpeakWithPlants","label":"Speak With Plants","comment":"You imbue plants within 30 feet of you with limited sentience and animation, giving them the ability to communicate with you and follow your simple commands. You can question plants about events in the spell's area within the past day, gaining information about creatures that have passed, weather, and other circumstances.","parents":["ttrpg:Spell"]},{"id":"dnd:SpiderClimb","label":"Spider Climb","comment":"Until the spell ends, one willing creature you touch gains the ability to move up, down, and across vertical surfaces and upside down along ceilings, while leaving its hands free. The target also gains a climbing speed equal to its walking speed.","parents":["ttrpg:Spell"]},{"id":"dnd:SpikeGrowth","label":"Spike Growth","comment":"The ground in a 20-foot radius centered on a point within range twists and sprouts hard spikes and thorns. The area becomes difficult terrain for the duration. When a creature moves into or within the area, it takes 2d4 piercing damage for every 5 feet it travels.","parents":["ttrpg:Spell"]},{"id":"dnd:SpiritGuardians","label":"Spirit Guardians","comment":"You call forth spirits to protect you. They flit around you to a distance of 15 feet for the duration. If you are good or neutral, their spectral form appears angelic or fey (your choice). If you are evil, they appear fiendish.","parents":["ttrpg:Spell"]},{"id":"dnd:SpiritualWeapon","label":"Spiritual Weapon","comment":"You create a floating, spectral weapon within range that lasts for the duration or until you cast this spell again. When you cast the spell, you can make a melee spell attack against a creature within 5 feet of the weapon. On a hit, the target takes force damage equal to 1d8 + your spellcasting ability modifier.","parents":["ttrpg:Spell"]},{"id":"dnd:StinkingCloud","label
