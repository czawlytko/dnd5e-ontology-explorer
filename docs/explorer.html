<style>
/* Layout: one-screen explorer — header strip, graph canvas left, detail "stat block" panel right; stacks on phones */
:root {
  --bg: #f2f3f6;
  --panel: #ffffff;
  --fg: #1c2030;
  --muted: #5d6477;
  --line: #d5d9e3;
  --link: #b9bfcd;
  --accent: #a3261d;
  --accent-soft: #f6e3e0;
  --cat-char: #2b66a8;
  --cat-feat: #b5541a;
  --cat-world: #2f7d45;
  --cat-gear: #85641b;
  --cat-magic: #7344b0;
  --f-display: "Alegreya SC", "Palatino Linotype", Georgia, serif;
  --f-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", Consolas, ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141b; --panel: #1a1d27; --fg: #e4e6ee; --muted: #9aa1b4; --line: #2c3140; --link: #3c4254;
    --accent: #f07a6c; --accent-soft: #3a1f1d;
    --cat-char: #6fa6e6; --cat-feat: #ec955a; --cat-world: #6cc287; --cat-gear: #d6b15d; --cat-magic: #b293ec;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12141b; --panel: #1a1d27; --fg: #e4e6ee; --muted: #9aa1b4; --line: #2c3140; --link: #3c4254;
  --accent: #f07a6c; --accent-soft: #3a1f1d;
  --cat-char: #6fa6e6; --cat-feat: #ec955a; --cat-world: #6cc287; --cat-gear: #d6b15d; --cat-magic: #b293ec;
  color-scheme: dark;
}
.cat-char { --c: var(--cat-char) } .cat-feat { --c: var(--cat-feat) } .cat-world { --c: var(--cat-world) }
.cat-gear { --c: var(--cat-gear) } .cat-magic { --c: var(--cat-magic) } .cat-none { --c: var(--muted) }

html, body { height: 100% }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45 }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px; box-sizing: border-box }

header { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 24px }
.brand { min-width: 0 }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 1.7rem; line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: .01em }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: .86rem }
.brand p b { font-weight: 500; color: var(--fg) }
.cats { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto }
.cat-btn { font: 500 .85rem/1 var(--f-body); color: var(--fg); background: var(--panel); border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 11px 6px 9px; display: inline-flex; align-items: center; gap: 7px; cursor: pointer }
.cat-btn:hover { border-color: var(--c) }
.cat-btn .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c) }
.cat-btn .n { color: var(--muted); font-variant-numeric: tabular-nums }

main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 12px; min-height: 0 }
.stage { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: grid; grid-template-rows: auto 1fr; min-height: 0; overflow: hidden }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 10px; border-bottom: 1px solid var(--line) }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden }
.tabs button { font: 500 .88rem/1 var(--f-body); padding: 7px 12px; border: 0; background: transparent; color: var(--muted); cursor: pointer }
.tabs button[aria-selected="true"] { background: var(--fg); color: var(--panel) }
.search { position: relative; flex: 1 1 220px; min-width: 0; max-width: 340px }
.search input { width: 100%; box-sizing: border-box; font: .92rem var(--f-body); padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg) }
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px }
.results { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; right: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  box-shadow: 0 8px 24px rgb(0 0 0 / .14); max-height: 340px; overflow: auto; padding: 4px; margin: 0; list-style: none }
.results li { padding: 6px 8px; border-radius: 4px; cursor: pointer; display: flex; gap: 8px; align-items: baseline }
.results li[aria-selected="true"], .results li:hover { background: var(--bg) }
.results .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; transform: translateY(-1px) }
.results small { color: var(--muted); font-family: var(--f-mono); font-size: .72rem; margin-left: auto; white-space: nowrap }
.opts { display: flex; gap: 6px 12px; align-items: center; flex-wrap: wrap; font-size: .86rem; color: var(--muted) }
.opts label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer }
.btn { font: 500 .84rem/1 var(--f-body); padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--fg); cursor: pointer }
.btn:hover { border-color: var(--muted) }
button:focus-visible, .chip:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

.canvas { position: relative; min-height: 0 }
.canvas svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none }
.canvas svg:active { cursor: grabbing }
.hint { position: absolute; left: 10px; bottom: 8px; font-size: .78rem; color: var(--muted); pointer-events: none; background: color-mix(in srgb, var(--panel) 85%, transparent); padding: 2px 6px; border-radius: 4px }

/* tree */
.link { fill: none; stroke: var(--link); stroke-width: 1.2 }
.node { cursor: pointer }
.node circle { stroke: var(--c); stroke-width: 1.8; fill: var(--panel) }
.node.has-hidden circle { fill: var(--c) }
.node.group circle { stroke-dasharray: 2 2 }
.node.cat circle, .node.root circle { stroke-width: 2.5 }
.node text { font: 13px var(--f-body); fill: var(--fg); paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; dominant-baseline: middle }
.node.cat text, .node.root text { font: 700 15px var(--f-display) }
.node.group text { font-style: italic; fill: var(--muted) }
.node text .cnt { fill: var(--muted); font: 11px var(--f-mono) }
.node text .multi { fill: var(--accent); font: 11px var(--f-body) }
.node.sel circle { stroke: var(--accent); stroke-width: 3; r: 7 }
.node.sel text { font-weight: 700; fill: var(--accent) }
.node:hover text { text-decoration: underline }

/* schema */
.edge { fill: none; stroke: var(--link); stroke-width: 1.4 }
.edge.hot { stroke: var(--accent); stroke-width: 2.2 }
.edge-label { font: 11.5px var(--f-mono); fill: var(--muted); paint-order: stroke; stroke: var(--panel); stroke-width: 4px; cursor: pointer; text-anchor: middle }
.edge-label.hot { fill: var(--accent) }
.snode rect { fill: var(--panel); stroke: var(--c); stroke-width: 1.8; rx: 5 }
.snode.ext rect { stroke-dasharray: 4 3 }
.snode.dt rect { fill: var(--bg); stroke: var(--line) }
.snode text { font: 500 13px var(--f-body); fill: var(--fg); text-anchor: middle; dominant-baseline: middle; pointer-events: none }
.snode.dt text { font: 12px var(--f-mono); fill: var(--muted) }
.snode { cursor: pointer }
.snode.sel rect { stroke: var(--accent); stroke-width: 3 }
#arrow path { fill: var(--link) } #arrow-hot path { fill: var(--accent) }

/* detail panel */
aside { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: auto; min-height: 0; padding: 18px 18px 22px }
.kicker { display: flex; align-items: center; gap: 8px; font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--c); font-weight: 700 }
.kicker .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c) }
aside h2 { font-family: var(--f-display); font-weight: 700; font-size: 1.75rem; line-height: 1.1; margin: 6px 0 4px; text-wrap: balance }
.iri { font: .76rem var(--f-mono); color: var(--muted); word-break: break-all }
.ns-note { font-size: .8rem; color: var(--muted); margin-top: 4px }
.rule { height: 0; border: 0; border-top: 2px solid var(--accent); margin: 14px 0; opacity: .7 }
.desc { margin: 0; max-width: 62ch }
.desc.empty { color: var(--muted); font-style: italic }
.sec { margin-top: 16px }
.sec h3 { font: 700 .74rem var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 7px; display: flex; gap: 6px }
.sec h3 .n { font-family: var(--f-mono); font-weight: 400; letter-spacing: 0 }
.chips { display: flex; flex-wrap: wrap; gap: 5px }
.chip { font: .84rem/1.2 var(--f-body); border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 4px 9px 4px 7px; border-radius: 999px; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; text-align: left }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none }
.chip:hover { border-color: var(--c) }
.chip.static { cursor: default; font-family: var(--f-mono); font-size: .76rem }
.chip.more { color: var(--muted); border-style: dashed }
.rel { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; align-items: start; font-size: .88rem }
.rel .p { font: .76rem var(--f-mono); color: var(--accent); padding-top: 5px; white-space: nowrap }
.actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap }
.meta { font-size: .78rem; color: var(--muted); margin-top: 22px; border-top: 1px solid var(--line); padding-top: 10px }

@media (max-width: 860px) {
  html, body { height: auto }
  .app { height: auto }
  main { grid-template-columns: minmax(0, 1fr) }
  .stage { height: 64vh; min-height: 400px }
  .cats { margin-left: 0 }
  .brand h1 { font-size: 1.45rem }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

</head>

<div class="app">

      <h1>D&amp;D 5e Character Ontology</h1>

    </div>
    <nav class="cats" id="cats" aria-label="Categories"></nav>

          <button role="tab" id="tab-schema" aria-selected="false">Property schema</button>

        <div class="search">
          <input id="q" type="search" placeholder="Find a class: Fireball, Rogue, Stealth…" autocomplete="off" aria-label="Search classes">

        <svg id="tree-svg" aria-label="Class hierarchy tree"></svg>
        <svg id="schema-svg" aria-label="Property domain and range graph" hidden></svg>
        <div class="hint" id="hint">Click a node to open it · drag to pan · scroll or pinch to zoom</div>
      </div>
    </section>
    <aside id="detail" aria-live="polite"></aside>
  </main>
</div>

<script type="application/json" id="onto">{"nodes":[{"id":"dnd:Race","label":"Race","comment":"A DnD5eCharacter:Race is the superclass that represents the concept of a race within Dungeons and Dragons. Every TTRpg:Character, playable or not, has a race.","parents":["ttrpg:CharacterType"]},{"id":"dnd:Dragonborn","label":"Dragonborn","comment":"The dragonborn walk proudly through a world that greets them with fearful incomprehension. Shaped by the dragons themselves, dragonborn originally hatched from dragon eggs as a unique race, combining the best attributes of dragons and humanoids.","parents":["dnd:Race"]},{"id":"dnd:Gnome","label":"Gnome","comment":"A constant hum of busy activity pervades the warrens and neighborhoods where gnomes form their close-knit communities. Louder sounds punctuate the hum: a crunch of grinding gears here, a minor explosion there, a yelp of surprise or triumph, and especially bursts of laughter. Gnomes take delight in life, enjoying every moment of invention, exploration, investigation, creation, and play.","parents":["dnd:Race"]},{"id":"dnd:Halfling","label":"Halfling","comment":"The comforts of home are the goals of most halflings' lives: a place to settle in peace and quiet, far from marauding monsters and clashing armies. Others form nomadic bands that travel constantly, lured by the open road and the wide horizon to discover the wonders of new lands and peoples. Halflings work readily with others, and they are loyal to their friends, whether halfling or otherwise. They can display remarkable ferocity when their friends, families, or communities are threatened.","parents":["dnd:Race"]},{"id":"dnd:Dwarf","label":"Dwarf","comment":"Kingdoms rich in ancient grandeur, halls carved into the roots of mountains, the echoing of picks and hammers in deep mines and blazing forges, a commitment to clan and tradition, and a burning hatred of goblins and orcs - these common threads unite all dwarves.","parents":["dnd:Race"]},{"id":"dnd:HalfElf","label":"Half-Elf","comment":"Walking in two worlds but truly belonging to neither, half-elves combine what some say are the best qualities of their elf and human parents: human curiosity, inventiveness, and ambition tempered by the refined senses, love of nature, and artistic tastes of the elves.","parents":["dnd:Race"]},{"id":"dnd:Elf","label":"Elf","comment":"Elves are a magical people of otherworldly grace, living in places of ethereal beauty, in the midst of ancient forests or in silvery spires glittering with faerie light, where soft music drifts through the air and gentle fragrances waft on the breeze. Elves love nature and magic, art and artistry, music and poetry.","parents":["dnd:Race"]},{"id":"dnd:HalfOrc","label":"Half-Orc","comment":"When alliances between humans and orcs are sealed by marriages, half-orcs are born. Some half-orcs rise to become proud chiefs of orc tribes, their human blood giving them an edge over their full-blooded orc rivals. Some venture into the world to prove their worth among humans and other more civilized races. Many of these become adventurers, achieving greatness for their mighty deeds and notoriety for their barbaric customs and savage fury.","parents":["dnd:Race"]},{"id":"dnd:Human","label":"Human","comment":"In the reckonings of most worlds, humans are the youngest of the common races, late to arrive on the world scene and short-lived in comparison to dwarves, elves, and dragons. Perhaps it is because of their shorter lives that they strive to achieve as much as they can in the years they are given. Or maybe they feel they have something to prove to the elder races, and that's why they build their mighty empires on the foundation of conquest and trade. Whatever drives them, humans are the innovators, the achievers, and the pioneers of the worlds.","parents":["dnd:Race"]},{"id":"dnd:Tiefling","label":"Tiefling","comment":"To be greeted with stares and whispers, to suffer violence and insult on the street, to see mistrust and fear in every eye: this is the lot of the tiefling. And to twist the knife, tieflings know that this is because a pact struck generations ago infused the essence of Asmodeus, overlord of the Nine Hells (and many of the other powerful devils serving under him) into their bloodline. Their appearance and their nature are not their fault but the result of an ancient sin, for which they and their children and their children's children will always be held accountable.","parents":["dnd:Race"]},{"id":"dnd:Subrace","label":"Subrace","comment":"A DnD5eCharacter:Subrace is the superclass that represents the concept of a subrace within Dungeons and Dragons. This further specifies the race of a character. Not every race has subraces tied to it.","parents":[]},{"id":"dnd:HillDwarf","label":"Hill Dwarf","comment":"","parents":["dnd:Subrace"]},{"id":"dnd:HighElf","label":"High Elf","comment":"","parents":["dnd:Subrace"]},{"id":"dnd:RockGnome","label":"Rock Gnome","comment":"","parents":["dnd:Subrace"]},{"id":"dnd:Lightfoot","label":"Lightfoot","comment":"","parents":["dnd:Subrace"]},{"id":"dnd:Callshite","label":"Callshite","comment":"","parents":["dnd:Subrace"]},{"id":"dnd:Chondathan","label":"Chondathan","comment":"","parents":["dnd:Subrace"]},{"id":"dnd:Damaran","label":"Damaran","comment":"","parents":["dnd:Subrace"]},{"id":"dnd:Illuskan","label":"Illuskan","comment":"","parents":["dnd:Subrace"]},{"id":"dnd:Mulan","label":"Mulan","comment":"","parents":["dnd:Subrace"]},{"id":"dnd:Rashemi","label":"Rashemi","comment":"","parents":["dnd:Subrace"]},{"id":"dnd:Shou","label":"Shou","comment":"","parents":["dnd:Subrace"]},{"id":"dnd:Tethyrian","label":"Tethyrian","comment":"","parents":["dnd:Subrace"]},{"id":"dnd:Turami","label":"Turami","comment":"","parents":["dnd:Subrace"]},{"id":"dnd:Variant","label":"Variant","comment":"A DnD5eCharacter:Variant is the superclass that represents the concept of a variant within Dungeons and Dragons. This further specifies the race of a character. Not every race has variants tied to it.","parents":[]},{"id":"dnd:StandardHuman","label":"Standard Human","comment":"","parents":["dnd:Variant"]},{"id":"dnd:VariantHuman","label":"Variant Human","comment":"","parents":["dnd:Variant"]},{"id":"dnd:Class","label":"Class","comment":"A DnD5eCharacter:Class is the superclass that represents the concept of a class within Dungeons and Dragons. Every TTRpg:Character, playable or not, has a class.","parents":["ttrpg:CharacterType"]},{"id":"dnd:Barbarian","label":"Barbarian","comment":"For some, their rage springs from a communion with fierce animal spirits. Others draw from a roiling reservoir of anger at a world full of pain. For every barbarian, rage is a power that fuels not just a battle frenzy but also uncanny reflexes, resilience, and feats of strength.","parents":["dnd:Class"]},{"id":"dnd:Druid","label":"Druid","comment":"Whether calling on the elemental forces of nature or emulating the creatures of the animal world, druids are an embodiment of nature's resilience, cunning, and fury. They claim no mastery over nature, but see themselves as extensions of nature's indomitable will.","parents":["dnd:Class"]},{"id":"dnd:Paladin","label":"Paladin","comment":"Whether sworn before a god's altar and the witness of a priest, in a sacred glade before nature spirits and fey beings, or in a moment of desperation and grief with the dead as the only witness, a paladin's oath is a powerful bond.","parents":["dnd:Class"]},{"id":"dnd:Sorcerer","label":"Sorcerer","comment":"Sorcerers carry a magical birthright conferred upon them by an exotic bloodline, some otherworldly influence, or exposure to unknown cosmic forces. No one chooses sorcery; the power chooses the sorcerer.","parents":["dnd:Class"]},{"id":"dnd:Bard","label":"Bard","comment":"Whether scholar, skald, or scoundrel, a bard weaves magic through words and music to inspire allies, demoralize foes, manipulate minds, create illusions, and even heal wounds. The bard is a master of song, speech, and the magic they contain.","parents":["dnd:Class"]},{"id":"dnd:Fighter","label":"Fighter","comment":"Fighters share an unparalleled mastery with weapons and armor, and a thorough knowledge of the skills of combat. They are well acquainted with death, both meting it out and staring it defiantly in the face.","parents":["dnd:Class"]},{"id":"dnd:Ranger","label":"Ranger","comment":"Far from the bustle of cities and towns, past the hedges that shelter the most distant farms from the terrors of the wild, amid the dense-packed trees of trackless forests and across wide and empty plains, rangers keep their unending watch.","parents":["dnd:Class"]},{"id":"dnd:Warlock","label":"Warlock","comment":"Warlocks are seekers of the knowledge that lies hidden in the fabric of the multiverse. Through pacts made with mysterious beings of supernatural power, warlocks unlock magical effects both subtle and spectacular.","parents":["dnd:Class"]},{"id":"dnd:Cleric","label":"Cleric","comment":"Clerics are intermediaries between the mortal world and the distant planes of the gods. As varied as the gods they serve, clerics strive to embody the handiwork of their deities. No ordinary priest, a cleric is imbued with divine magic.","parents":["dnd:Class"]},{"id":"dnd:Monk","label":"Monk","comment":"Monks are united in their ability to magically harness the energy that flows in their bodies. Whether channeled as a striking display of combat prowess or a subtler focus of defensive ability and speed, this energy infuses all that a monk does.","parents":["dnd:Class"]},{"id":"dnd:Rogue","label":"Rogue","comment":"Rogues rely on skill, stealth, and their foes' vulnerabilities to get the upper hand in any situation. They have a knack for finding the solution to just about any problem, demonstrating a resourcefulness and versatility that is the cornerstone of any successful adventuring party.","parents":["dnd:Class"]},{"id":"dnd:Wizard","label":"Wizard","comment":"Wizards are supreme magic-users, defined and united as a class by the spells they cast. Drawing on the subtle weave of magic that permeates the cosmos, wizards cast spells of explosive fire, arcing lightning, subtle deception, brute-force mind control, and much more.","parents":["dnd:Class"]},{"id":"dnd:Subclass","label":"Subclass","comment":"A DnD5eCharacter:Subclass is the superclass that represents the concept of a subclass within Dungeons and Dragons. Every DnD5eCharacter:Class has one or more DnD5eCharacter:Subclass attached to it. These often unlock at later levels.","parents":[]},{"id":"dnd:PrimalPath","label":"Primal Path","comment":"At 3rd level, you choose a path that shapes the nature of your rage.","parents":["dnd:Subclass"]},{"id":"dnd:PathOfTheBerserker","label":"Path Of The Berserker","comment":"","parents":["dnd:PrimalPath"]},{"id":"dnd:DruidCircle","label":"Druid Circle","comment":"At 2nd level, you choose to identify with a circle of druids.","parents":["dnd:Subclass"]},{"id":"dnd:CircleOfTheLand","label":"Circle Of The Land","comment":"","parents":["dnd:DruidCircle"]},{"id":"dnd:SacredOath","label":"Sacred Oath","comment":"When you reach 3rd level, you swear the oath that binds you as a paladin forever. Up to this time you have been in a preparatory stage, committed to the path but not yet sworn to it.","parents":["dnd:Subclass"]},{"id":"dnd:OathOfDevotion","label":"Oath Of Devotion","comment":"","parents":["dnd:SacredOath"]},{"id":"dnd:PaladinFightingStyle","label":"Paladin Fighting Style","comment":"Starting at 2nd level, you adopt a particular style of fighting as your specialty.","parents":["dnd:Subclass"]},{"id":"dnd:SorcerousOrigin","label":"Sorcerous Origin","comment":"Choose a sorcerous origin, which describes the source of your innate magical power.","parents":["dnd:Subclass"]},{"id":"dnd:DraconicBloodline","label":"Draconic Bloodline","comment":"","parents":["dnd:SorcerousOrigin"]},{"id":"dnd:BlueDragon","label":"Blue Dragon","comment":"","parents":["dnd:Subrace","dnd:DraconicBloodline"]},{"id":"dnd:BlackDragon","label":"Black Dragon","comment":"","parents":["dnd:Subrace","dnd:DraconicBloodline","dnd:DraconicAncestry"]},{"id":"dnd:CopperDragon","label":"Copper Dragon","comment":"","parents":["dnd:Subrace","dnd:DraconicBloodline","dnd:DraconicAncestry"]},{"id":"dnd:RedDragon","label":"Red Dragon","comment":"","parents":["dnd:Subrace","dnd:DraconicBloodline","dnd:DraconicAncestry"]},{"id":"dnd:BrassDragon","label":"Brass Dragon","comment":"","parents":["dnd:Subrace","dnd:DraconicBloodline","dnd:DraconicAncestry"]},{"id":"dnd:GoldDragon","label":"Gold Dragon","comment":"","parents":["dnd:Subrace","dnd:DraconicBloodline","dnd:DraconicAncestry"]},{"id":"dnd:SilverDragon","label":"Silver Dragon","comment":"","parents":["dnd:Subrace","dnd:DraconicBloodline","dnd:DraconicAncestry"]},{"id":"dnd:BronzeDragon","label":"Bronze Dragon","comment":"","parents":["dnd:Subrace","dnd:DraconicBloodline","dnd:DraconicAncestry"]},{"id":"dnd:GreenDragon","label":"Green Dragon","comment":"","parents":["dnd:Subrace","dnd:DraconicBloodline","dnd:DraconicAncestry"]},{"id":"dnd:WhiteDragon","label":"White Dragon","comment":"","parents":["dnd:Subrace","dnd:DraconicBloodline","dnd:DraconicAncestry"]},{"id":"dnd:MetaMagic","label":"Meta Magic","comment":"At 3rd level, you gain the ability to twist your spells to suit your needs. You gain two Metamagic options of your choice.","parents":["dnd:Subclass"]},{"id":"dnd:CarefulSpell","label":"Careful Spell","comment":"","parents":["dnd:MetaMagic"]},{"id":"dnd:HeightenedSpell","label":"Heightened Spell","comment":"","parents":["dnd:MetaMagic"]},{"id":"dnd:DistantSpell","label":"Distant Spell","comment":"","parents":["dnd:MetaMagic"]},{"id":"dnd:QuickenedSpell","label":"Quickened Spell","comment":"","parents":["dnd:MetaMagic"]},{"id":"dnd:EmpoweredSpell","label":"Empowered Spell","comment":"","parents":["dnd:MetaMagic"]},{"id":"dnd:SubtleSpell","label":"Subtle Spell","comment":"","parents":["dnd:MetaMagic"]},{"id":"dnd:ExtendedSpell","label":"Extended Spell","comment":"","parents":["dnd:MetaMagic"]},{"id":"dnd:TwinnedSpell","label":"Twinned Spell","comment":"","parents":["dnd:MetaMagic"]},{"id":"dnd:BardCollege","label":"Bard College","comment":"At 3rd level, you delve into the advanced techniques of a bard college of your choice. ","parents":["dnd:Subclass"]},{"id":"dnd:CollegeOfLore","label":"College Of Lore","comment":"","parents":["dnd:BardCollege"]},{"id":"dnd:FightingStyle","label":"Fighting Style","comment":"Abilities that give martial combatants an edge in battle. ","parents":[]},{"id":"dnd:FighterFightingStyle","label":"Fighter Fighting Style","comment":"You adopt a particular style of fighting as your specialty.","parents":["dnd:Subclass"]},{"id":"dnd:Archery","label":"Archery","comment":"","parents":["dnd:FightingStyle","dnd:FighterFightingStyle","dnd:RangerFightingStyle"]},{"id":"dnd:Defense","label":"Defense","comment":"","parents":["dnd:FightingStyle","dnd:FighterFightingStyle","dnd:RangerFightingStyle","dnd:PaladinFightingStyle"]},{"id":"dnd:Dueling","label":"Dueling","comment":"","parents":["dnd:FightingStyle","dnd:FighterFightingStyle","dnd:RangerFightingStyle","dnd:PaladinFightingStyle"]},{"id":"dnd:GreatWeaponFighting","label":"Great Weapon Fighting","comment":"","parents":["dnd:FightingStyle","dnd:FighterFightingStyle","dnd:PaladinFightingStyle"]},{"id":"dnd:Protection","label":"Protection","comment":"","parents":["dnd:FightingStyle","dnd:FighterFightingStyle","dnd:PaladinFightingStyle"]},{"id":"dnd:TwoWeaponFighting","label":"Two Weapon Fighting","comment":"","parents":["dnd:FightingStyle","dnd:FighterFightingStyle","dnd:RangerFightingStyle"]},{"id":"dnd:RangerArchetype","label":"Ranger Archetype","comment":"At 3rd level, you choose to emulate the ideals and training of a ranger conclave.","parents":["dnd:Subclass"]},{"id":"dnd:Hunter","label":"Hunter","comment":"","parents":["dnd:RangerArchetype"]},{"id":"dnd:Multiattack","label":"Multiattack","comment":"","parents":["dnd:Hunter"]},{"id":"dnd:Volley","label":"Volley","comment":"","parents":["dnd:Multiattack"]},{"id":"dnd:WhirlwindAttack","label":"WhirlwindAttack","comment":"","parents":["dnd:Multiattack"]},{"id":"dnd:DefensiveTactics","label":"Defensive Tactics","comment":"","parents":["dnd:Hunter"]},{"id":"dnd:HuntersPrey","label":"Hunter's Prey","comment":"","parents":["dnd:Hunter"]},{"id":"dnd:ColossusSlayer","label":"Colossus Slayer","comment":"","parents":["dnd:HuntersPrey"]},{"id":"dnd:HordeBreaker","label":"Horde Breaker","comment":"","parents":["dnd:HuntersPrey"]},{"id":"dnd:GiantKiller","label":"Giant Killer","comment":"","parents":["dnd:HuntersPrey"]},{"id":"dnd:SuperiorHuntersDefense","label":"Superior Hunter's Defense","comment":"","parents":["dnd:Hunter"]},{"id":"dnd:Evasion","label":"Evasion","comment":"","parents":["dnd:SuperiorHuntersDefense"]},{"id":"dnd:UncannyDodge","label":"Uncanny Dodge","comment":"","parents":["dnd:SuperiorHuntersDefense"]},{"id":"dnd:StandAgainstTheTide","label":"Stand Against The Tide","comment":"","parents":["dnd:SuperiorHuntersDefense"]},{"id":"dnd:FavoredEnemy","label":"Favored Enemy","comment":"Beginning at 1st level, you have significant experience studying, tracking, hunting, and even talking to a certain type of enemy.","parents":["dnd:Subclass"]},{"id":"dnd:FavoredHumanoids","label":"Favored Humanoids","comment":"","parents":["dnd:FavoredEnemy"]},{"id":"dnd:FavoredMonsterType","label":"Favored Monster Type","comment":"","parents":["dnd:FavoredEnemy"]},{"id":"dnd:FavoredTerrain","label":"Favored Terrain","comment":"At 1st level, you are particularly familiar with one type of natural environment and are adept at traveling and surviving in such regions.","parents":["dnd:Subclass"]},{"id":"dnd:RangerFightingStyle","label":"Ranger Fighting Style","comment":"At 2nd level, you adopt a particular style of fighting as your specialty.","parents":["dnd:Subclass"]},{"id":"dnd:OtherworldlyPatron","label":"Otherworldly Patron","comment":"At 1st level, you have struck a bargain with an otherworldly being of your choice.","parents":["dnd:Subclass"]},{"id":"dnd:TheFiend","label":"The Fiend","comment":"","parents":["dnd:OtherworldlyPatron"]},{"id":"dnd:PactBoon","label":"Pact Boon","comment":"At 3rd level, your otherworldly patron bestows a gift upon you for your loyal service.","parents":["dnd:Subclass"]},{"id":"dnd:PactOfTheBlade","label":"Pact Of The Blade","comment":"","parents":["dnd:PactBoon"]},{"id":"dnd:PactOfTheTome","label":"Pact Of The Tome","comment":"","parents":["dnd:PactBoon"]},{"id":"dnd:PactOfTheChain","label":"Pact Of The Chain","comment":"","parents":["dnd:PactBoon"]},{"id":"dnd:DivineDomain","label":"Divine Domain","comment":"At 1st level, you choose a domain shaped by your choice of Deity and the gifts they grant you.","parents":["dnd:Subclass"]},{"id":"dnd:LifeDomain","label":"Life Domain","comment":"","parents":["dnd:DivineDomain"]},{"id":"dnd:MonkasticTradition","label":"Monkastic Tradition","comment":"When you reach 3rd level, you commit yourself to a monastic tradition.","parents":["dnd:Subclass"]},{"id":"dnd:WayOfTheOpenHand","label":"Way Of The Open Hand","comment":"","parents":["dnd:MonkasticTradition"]},{"id":"dnd:RoguishArchetype","label":"Roguish Archetype","comment":"At 3rd level, you choose an archetype that you emulate in the exercise of your rogue abilities.","parents":["dnd:Subclass"]},{"id":"dnd:Thief","label":"Thief","comment":"","parents":["dnd:RoguishArchetype"]},{"id":"dnd:ArcaneTradition","label":"Arcane Tradition","comment":"When you reach 2nd level, you choose an arcane tradition, shaping your practice of magic through one of the following schools.","parents":["dnd:Subclass"]},{"id":"dnd:SchoolOfEvocation","label":"School Of Evocation","comment":"","parents":["dnd:ArcaneTradition"]},{"id":"dnd:AbilityScore","label":"Ability Score","comment":"An indicator of a characters aptness in a certain ability. These abilities are strength, dexterity, constitution, intelligence, wisdom and charisma.","parents":["ttrpg:CharacterType"]},{"id":"dnd:Strength","label":"Strength","comment":"Strength measures bodily power, athletic Training, and the extent to which you can exert raw physical force.","parents":["dnd:AbilityScore"]},{"id":"dnd:Dexterity","label":"Dexterity","comment":"Dexterity measures agility, reflexes, and balance.","parents":["dnd:AbilityScore"]},{"id":"dnd:Constitution","label":"Constitution","comment":"Constitution measures health, stamina, and vital force.","parents":["dnd:AbilityScore"]},{"id":"dnd:Intelligence","label":"Intelligence","comment":"Intelligence measures mental acuity, accuracy of recall, and the ability to reason.","parents":["dnd:AbilityScore"]},{"id":"dnd:Wisdom","label":"Wisdom","comment":"Wisdom reflects how attuned you are to the world around you and represents perceptiveness and intuition.","parents":["dnd:AbilityScore"]},{"id":"dnd:Charisma","label":"Charisma","comment":"Charisma measures your ability to interact effectively with others. It includes such factors as confidence and eloquence, and it can represent a charming or commanding Personality.","parents":["dnd:AbilityScore"]},{"id":"dnd:Skill","label":"Skill","comment":"An indicator of a characters aptness in a certain skill that is derived from a parent ability.","parents":["ttrpg:CharacterType"]},{"id":"dnd:Acrobatics","label":"Acrobatics","comment":"Your Acrobatics check covers your attempt to stay on your feet in a tricky situation, such as when you're trying to run across a sheet of ice, balance on a tightrope, or stay upright on a rocking ship's deck.","parents":["dnd:Skill"]},{"id":"dnd:AnimalHandling","label":"Animal Handling","comment":"When there is any question whether you can calm down a domesticated animal, keep a mount from getting spooked, or intuit an animal's intentions, the GM might call for a Animal Handling check. You also make a Animal Handling check to control your mount when you attempt a risky maneuver.","parents":["dnd:Skill"]},{"id":"dnd:Arcana","label":"Arcana","comment":"Your Arcana check measures your ability to recall lore about Spells, magic items, eldritch Symbols, magical traditions, The Planes of existence, and the inhabitants of those planes.","parents":["dnd:Skill"]},{"id":"dnd:Athletics","label":"Athletics","comment":"Your Athletics check covers difficult situations you encounter while climbing, Jumping, or Swimming.","parents":["dnd:Skill"]},{"id":"dnd:Deception","label":"Deception","comment":"Your Deception check determines whether you can convincingly hide the truth, either verbally or through your Actions. This Deception can encompass everything from misleading others through ambiguity to telling outright lies. Typical situations include trying to fast- talk a guard, con a merchant, earn money through Gambling, pass yourself off in a disguise, dull someone's suspicions with false assurances, or maintain a straight face while telling a blatant lie.","parents":["dnd:Skill"]},{"id":"dnd:History","label":"History","comment":"Your History check measures your ability to recall lore about historical events, legendary people, ancient kingdoms, past disputes, recent wars, and lost civilizations.","parents":["dnd:Skill"]},{"id":"dnd:Insight","label":"Insight","comment":"Your Insight check decides whether you can determine the true intentions of a creature, such as when searching out a lie or predicting someone's next move. Doing so involves gleaning clues from body language, Speech habits, and changes in mannerisms.","parents":["dnd:Skill"]},{"id":"dnd:Initimidation","label":"Initimidation","comment":"When you attempt to Influence someone through overt threats, Hostile Actions, and physical violence, the GM might ask you to make a Intimidation check. Examples include trying to pry information out of a prisoner, convincing street thugs to back down from a confrontation, or using the edge of a broken bottle to convince a sneering vizier to reconsider a decision.","parents":["dnd:Skill"]},{"id":"dnd:Investigation","label":"Investigation","comment":"When you look around for clues and make deductions based on those clues, you make an Investigation check. You might deduce the Location of a hidden object, discern from the Appearance of a wound what kind of weapon dealt it, or determine the weakest point in a tunnel that could cause it to collapse. Poring through ancient Scrolls in Search of a hidden fragment of knowledge might also call for an Investigation check.","parents":["dnd:Skill"]},{"id":"dnd:Medicine","label":"Medicine","comment":"A Medicine check lets you try to stabilize a dying Companion or diagnose an illness.","parents":["dnd:Skill"]},{"id":"dnd:Nature","label":"Nature","comment":"Your Nature check measures your ability to recall lore about terrain, Plants and animals, the weather, and natural cycles.","parents":["dnd:Skill"]},{"id":"dnd:Perception","label":"Perception","comment":"Your Perception check lets you spot, hear, or otherwise detect the presence of something. It measures your general awareness of your surroundings and the keenness of your Senses. For example, you might try to hear a conversation through a closed door, eavesdrop under an open window, or hear Monsters moving stealthily in the Forest. Or you might try to spot things that are obscured or easy to miss, whether they are orcs lying in Ambush on a road, thugs Hiding in the shadows of an alley, or candlelight under a closed Secret door.","parents":["dnd:Skill"]},{"id":"dnd:Performance","label":"Performance","comment":"Your Performance check determines how well you can delight an audience with music, dance, Acting, Storytelling, or some other form of entertainment.","parents":["dnd:Skill"]},{"id":"dnd:Persuasion","label":"Persuasion","comment":"When you attempt to Influence someone or a group of people with tact, social graces, or good Nature, the GM might ask you to make a Persuasion check. Typically, you use Persuasion when Acting in good faith, to foster friendships, make cordial requests, or exhibit proper etiquette. Examples of persuading others include convincing a chamberlain to let your party see the king, negotiating peace between warring tribes, or inspiring a crowd of townsfolk.","parents":["dnd:Skill"]},{"id":"dnd:Religion","label":"Religion","comment":"Your Religion check measures your ability to recall lore about deities, rites and prayers, religious hierarchies, holy Symbols, and the practices of Secret cults.","parents":["dnd:Skill"]},{"id":"dnd:SleightOfHand","label":"Sleight Of Hand","comment":"Whenever you attempt an act of legerdemain or manual trickery, such as planting something on someone else or concealing an object on your person, make a Sleight of Hand check.","parents":["dnd:Skill"]},{"id":"dnd:Stealth","label":"Stealth","comment":"Make a Stealth check when you attempt to conceal yourself from enemies, slink past guards, slip away without Being Noticed, or sneak up on someone without being seen or heard.","parents":["dnd:Skill"]},{"id":"dnd:Survival","label":"Survival","comment":"The GM might ask you to make a Survival check to follow tracks, hunt wild game, guide your group through frozen wastelands, Identify signs that owlbears live nearby, predict the weather, or avoid Quicksand and other natural Hazards.","parents":["dnd:Skill"]},{"id":"dnd:Proficiency","label":"Proficiency","comment":"This means a character is proficient in a certain skill. The acommpanying skill can be indicated using the DnD5eCharacter:proficientIn property.","parents":["ttrpg:CharacterType"]},{"id":"dnd:Expertise","label":"Expertise","comment":"This means a character is an expert in a certain skill. The acommpanying skill can be indicated using the DnD5eCharacter:expertIn property.","parents":["ttrpg:CharacterType"]},{"id":"dnd:Alignemnt","label":"Alignment","comment":"A typical creature in the game world has an alignment, which broadly describes its moral and personal attitudes. Alignment is a combination of two factors: one identifies morality (good, evil, or neutral), and the other describes attitudes toward society and order (lawful, chaotic, or neutral).","parents":["dnd:Alignment"]},{"id":"dnd:LawfulGood","label":"Lawful Good","comment":"Lawful good (LG) creatures can be counted on to do the right thing as expected by society. Gold dragons, paladins, and most dwarves are lawful good.","parents":["dnd:Alignment"]},{"id":"dnd:NeutralGood","label":"Neutral Good","comment":"Neutral good (NG) folk do the best they can to help others according to their needs. Many celestials, some cloud giants, and most gnomes are neutral good.","parents":["dnd:Alignment"]},{"id":"dnd:ChaoticGood","label":"Chaotic Good","comment":"Chaotic good (CG) creatures act as their conscience directs, with little regard for what others expect. Copper dragons, many elves, and unicorns are chaotic good.","parents":["dnd:Alignment"]},{"id":"dnd:LawfulNeutral","label":"Lawful Neutral","comment":"Lawful neutral (LN) individuals act in accordance with law, tradition, or personal codes. Many monks and some wizards are lawful neutral.","parents":["dnd:Alignment"]},{"id":"dnd:Neutral","label":"Neutral","comment":"Neutral (N) is the alignment of those who prefer to steer clear of moral questions and don't take sides, doing what seems best at the time. Lizardfolk, most druids, and many humans are neutral.","parents":["dnd:Alignment"]},{"id":"dnd:ChaoticNeutral","label":"Chaotic Neutral","comment":"Chaotic neutral (CN) creatures follow their whims, holding their personal freedom above all else. Many barbarians and rogues, and some bards, are chaotic neutral.","parents":["dnd:Alignment"]},{"id":"dnd:LawfulEvil","label":"Lawful Evil","comment":"Lawful evil (LE) creatures methodically take what they want, within the limits of a code of tradition, loyalty, or order. Devils, blue dragons, and hobgoblins are lawful evil.","parents":["dnd:Alignment"]},{"id":"dnd:NeutralEvil","label":"Neutral Evil","comment":"Neutral evil (NE) is the alignment of those who do whatever they can get away with, without compassion or qualms. Many drow, some cloud giants, and goblins are neutral evil.","parents":["dnd:Alignment"]},{"id":"dnd:ChaoticEvil","label":"Chaotic Evil","comment":"Chaotic evil (CE) creatures act with arbitrary violence, spurred by their greed, hatred, or bloodlust. Demons, red dragons, and orcs are chaotic evil.","parents":["dnd:Alignment"]},{"id":"dnd:Background","label":"Background","comment":"A background gives more information about a character and can help you play that character by explaining their motivations and their past.","parents":["ttrpg:CharacterType"]},{"id":"dnd:Acolyte","label":"Acolyte","comment":"You have spent your life in the service of a temple to a specific god or pantheon of gods. You act as an intermediary between the realm of the holy and the mortal world, performing sacred rites and offering sacrifices in order to conduct worshipers into the presence of the divine. You are not necessarily a cleric - performing sacred rites is not the same thing as channeling divine power.","parents":["dnd:Background"]},{"id":"dnd:Monster","label":"Monster","comment":"A monster in Dungeons & Dragons, usually the actions of such a monster are decided by the DM.","parents":["ttrpg:CharacterType"]},{"id":"dnd:MonsterType","label":"Monster Type","comment":"A type of monster.","parents":[]},{"id":"dnd:Abberation","label":"Abberation","comment":"An aberration has a bizarre anatomy, strange abilities, alien mindset, or any combination thereof. All aberrations have darkvision. Examples include aboleths, beholders, and mind flayers.","parents":["dnd:MonsterType","dnd:FavoredMonsterType"]},{"id":"dnd:Beast","label":"Beast","comment":"An animal is a nonhuman, usually vertebrate creature. Animals have very low intelligence and usually low-light vision. This category does not include invertebrates, which are classed as vermin. Examples include bears, crocodiles, horses, and wolves. Dire animals are also considered animals.","parents":["dnd:MonsterType","dnd:FavoredMonsterType"]},{"id":"dnd:Celestial","label":"Celestial","comment":"Celestials are creatures native to the Upper Planes, and good by nature. Examples include angels, couatls, and pegasi.","parents":["dnd:MonsterType","dnd:FavoredMonsterType"]},{"id":"dnd:Construct","label":"Construct","comment":"Constructs are creatures that are created artificially. Examples include golems, although modrons are also constructs.","parents":["dnd:MonsterType","dnd:FavoredMonsterType"]},{"id":"dnd:Dragon","label":"Dragon","comment":"Dragons are large, powerful reptilian creatures. This includes both true dragons such as the chromatic and metallic dragons, but also related creatures such as wyverns.","parents":["dnd:MonsterType","dnd:FavoredMonsterType"]},{"id":"dnd:Elemental","label":"Elemental","comment":"Elementals are creatures from the Elemental Planes. Examples include the common elementals as well as azer, genies, and invisible stalkers.","parents":["dnd:MonsterType","dnd:FavoredMonsterType"]},{"id":"dnd:Fey","label":"Fey","comment":"Fey are creatures of magic with a connection to nature. Often they are connected to the Feywild, or certain Outer Planes such as Arboreaor the Beastlands. Examples include dryads and satyrs.","parents":["dnd:MonsterType","dnd:FavoredMonsterType"]},{"id":"dnd:Fiend","label":"Fiend","comment":"Fiends are creatures native to the Lower Planes, and evil by nature. Examples include demons, devils, and rakshasa.","parents":["dnd:MonsterType","dnd:FavoredMonsterType"]},{"id":"dnd:Giant","label":"Giant","comment":"Giants are human-like but larger thanhumans. Examples include the true giants as well as ogres and trolls.","parents":["dnd:MonsterType","dnd:FavoredMonsterType"]},{"id":"dnd:Humanoid","label":"Humanoid","comment":"Humanoids are the main people of most worlds, bipeds with culture but few natural magical abilities. Examples include humans, dwarves, elves and the goblinoid races.","parents":["dnd:MonsterType","dnd:FavoredMonsterType"]},{"id":"dnd:Monstrosity","label":"Monstrosity","comment":"Monstrosities are unnatural creatures from a variety of origins, including curses and magical experimentation. Examples include minotaurs and owlbears. The monstrosity type is also a 'catch-all' category for monsters that don't fit into other types.","parents":["dnd:MonsterType","dnd:FavoredMonsterType"]},{"id":"dnd:Ooze","label":"Ooze","comment":"Oozes are gelatinous creatures with no fixed form. Examples include black puddings and gelatinous cubes.","parents":["dnd:MonsterType","dnd:FavoredMonsterType"]},{"id":"dnd:Plant","label":"Plant","comment":"Plants include both vegetable and fungal creatures. Examples include hambling mounds and myconids.","parents":["dnd:MonsterType","dnd:FavoredMonsterType"]},{"id":"dnd:Undead","label":"Undead","comment":"Undead creatures were once alive, but reanimated by unnatural forces. Examples includeghosts,specters,vampires and zombies.","parents":["dnd:MonsterType","dnd:FavoredMonsterType"]},{"id":"dnd:Bugbear","label":"Bugbear","comment":"Bugbears resembled hairy, feral goblins standing 7?feet (2.1?meters) tall. They took their name from their noses and claws, which were similar to those of bears.","parents":["dnd:Humanoid","dnd:FavoredHumanoids"]},{"id":"dnd:Bullywug","label":"Bullywug","comment":"Bullywugs were a primitive race of frog-like humanoids found throughout the bogs and marshes of Toril, the self-proclaimed lords of the swamp. Savage and self-destructive, the bullywugs regularly tampered with forces beyond their understanding, threatening the safety of others and their own brutish, noisome, and wet lives.","parents":["dnd:Humanoid","dnd:FavoredHumanoids"]},{"id":"dnd:Githyanki","label":"Githyanki","comment":"The githyanki were a race of Astral Plane-dwellers. Survivors of a long enslavement by mind flayers, they became ruthless pillagers and raiders of many worlds in the Prime Material plane.","parents":["dnd:Humanoid","dnd:FavoredHumanoids"]},{"id":"dnd:Gitzerai","label":"Gitzerai","comment":"The githzerai were a humanoid race that dwelt primarily in the plane of Limbo. They descended from a splinter group of gith, a race that had been enslaved by mind flayers for centuries until they rebelled for their freedom. Philosophical differences led to a long and bloody civil war among the gith, who ended up divided into the militaristic githyanki and the ascetic githzerai.","parents":["dnd:Humanoid","dnd:FavoredHumanoids"]},{"id":"dnd:Gnoll","label":"Gnoll","comment":"Gnolls were a humanoid race that most closely resembled human-hyena hybrids within Faerûn. They were carnivorous humanoids, known for their savage culture and warlike ways.","parents":["dnd:Humanoid","dnd:FavoredHumanoids"]},{"id":"dnd:Goblin","label":"Goblin","comment":"Goblins were a race of small and numerous goblinoids common throughout Toril, often living in underground caverns near the surface known as lairs. The race was often, though not always, dominated by other goblinoids, most commonly hobgoblins. Goblins may have, in fact, been initially created by this related race to serve as scouts and infiltrators.","parents":["dnd:Humanoid","dnd:FavoredHumanoids"]},{"id":"dnd:Grimlock","label":"Grimlock","comment":"Grimlocks were a race of monstrous humanoids that lived in the Underdark, the degenerated descendants of humans who had wandered into its depths centuries ago.","parents":["dnd:Humanoid","dnd:FavoredHumanoids"]},{"id":"dnd:Hobgoblin","label":"Hobgoblin","comment":"Hobgoblins were larger, stronger, smarter, and more menacing forms of goblinoids than goblins, but not as powerful as bugbears.","parents":["dnd:Humanoid","dnd:FavoredHumanoids"]},{"id":"dnd:KoaToa","label":"Koa Toa","comment":"Kuo-toa (pronounced: Koa Toa), also known as gogglers and men-fish, were a debased, piscine race of warm-blooded and amphibious creatures that dwelt in the Underdark. Sinister secrets lurked below the surface of their alien minds, for the kuo-toa were fanatics plagued by mental instability that saw things others couldn't and worshiped gods that didn't exist — at least until they believed hard enough.","parents":["dnd:Humanoid","dnd:FavoredHumanoids"]},{"id":"dnd:Kobold","label":"Kobold","comment":"Kobolds were aggressive, insular, yet industrious small humanoid creatures. They were noted for their skill at building traps and preparing ambushes, and mining. They were distantly related to dragons and urds and were often found serving as their minions.","parents":["dnd:Humanoid","dnd:FavoredHumanoids"]},{"id":"dnd:Lizardfolk","label":"Lizardfolk","comment":"Lizardfolk, also known as lizard men, were a race of reptilian humanoids native to Toril.","parents":["dnd:Humanoid","dnd:FavoredHumanoids"]},{"id":"dnd:Merfolk","label":"Merfolk","comment":"Merfolk were aquatic humanoids with upper body, arm and head of a human and legs resembling the tail of a fish.","parents":["dnd:Humanoid","dnd:FavoredHumanoids"]},{"id":"dnd:Orc","label":"Orc","comment":"Orcs were a race of humanoids that had been a threat to the civilized cultures of Toril, particularly Faerûn, for as long as any could remember. This changed somewhat in the years preceding and immediately after the Spellplague, when a horde of mountain orcs under the command of King Obould Many-Arrows unified into a single kingdom, one that was remarkably civilized.","parents":["dnd:Humanoid","dnd:FavoredHumanoids"]},{"id":"dnd:ThriKreen","label":"Thri Kreen","comment":"The thri-kreen were an insectoid monstrous humanoid race that primarily lived in the Shaar. The thri-kreen were a race of nomads and hunters. They were also known as mantis warriors and sometimes called tri-kreen.","parents":["dnd:Humanoid","dnd:FavoredHumanoids"]},{"id":"dnd:Troglodyte","label":"Troglodyte","comment":"Troglodytes, often referred to as stinkmeat by the duergar, were cave-dwelling reptilian humanoids, with a barbaric culture centered around food and scent. The stench of an angry or frightened troglodyte was so foul that it sickened all living creatures nearby, even after the troglodyte had died.","parents":["dnd:Humanoid","dnd:FavoredHumanoids"]},{"id":"dnd:YuanTiPureblood","label":"Yuan Ti Pureblood","comment":"Purebloods were the most human-seeming of all true yuan-ti and one of three main breeds—the other two being the halfbloods and the abominations.","parents":["dnd:Humanoid","dnd:FavoredHumanoids"]},{"id":"dnd:Terrain","label":"Terrain","comment":"","parents":[]},{"id":"dnd:Arctic","label":"Arctic","comment":"","parents":["dnd:Terrain","dnd:FavoredTerrain"]},{"id":"dnd:Grassland","label":"Grassland","comment":"","parents":["dnd:Terrain","dnd:FavoredTerrain"]},{"id":"dnd:Coast","label":"Coast","comment":"","parents":["dnd:Terrain","dnd:FavoredTerrain"]},{"id":"dnd:Mountain","label":"Mountain","comment":"","parents":["dnd:Terrain","dnd:FavoredTerrain"]},{"id":"dnd:Desert","label":"Desert","comment":"","parents":["dnd:Terrain","dnd:FavoredTerrain"]},{"id":"dnd:Swamp","label":"Swamp","comment":"","parents":["dnd:Terrain","dnd:FavoredTerrain"]},{"id":"dnd:Forest","label":"Forest","comment":"","parents":["dnd:Terrain","dnd:FavoredTerrain"]},{"id":"dnd:Underdark","label":"Underdark","comment":"","parents":["dnd:Terrain","dnd:FavoredTerrain"]},{"id":"dnd:ItemEnhancement","label":"Item Enhancement","comment":"","parents":["ttrpg:ItemType"]},{"id":"dnd:PlusOne","label":"+1","comment":"Adds 1 to the chance to hit and to the damage dealt.","parents":["ttrpg:ItemEnhancement"]},{"id":"dnd:PlusTwo","label":"+2","comment":"Adds 2 to the chance to hit and to the damage dealt.","parents":["ttrpg:ItemEnhancement"]},{"id":"dnd:PlusThree","label":"+2","comment":"Adds 3 to the chance to hit and to the damage dealt.","parents":["ttrpg:ItemEnhancement"]},{"id":"dnd:BattleAxe","label":"Battle Axe","comment":"","parents":["ttrpg:Weapon"]},{"id":"dnd:Blowgun","label":"Blowgun","comment":"","parents":["ttrpg:Weap s","label":"Water Vehicles","comment":"","parents":["ttrpg:Tools"]},{"id":"dnd:Waterskin","label":"Waterskin","comment":"","parents":["ttrpg:Tools"]},{"id":"dnd:Whetstone","label":"Whetstone","comment":"","parents":["ttrpg:Tools"]},{"id":"dnd:WoodenStake","label":"Wooden Stake","comment":"","parents":["ttrpg:Tools"]},{"id":"dnd:WoodenStaff","label":"Wooden Staff","comment":"","parents":["ttrpg:Tools"]},{"id":"dnd:YewWand","label":"Yew Wand","comment":"","parents":["ttrpg:Tools"]},{"id":"dnd:MagicSchool","label":"Magic School","comment":"","parents":["ttrpg:SpellType"]},{"id":"dnd:Conjuration","label":"Conjuration","comment":"","parents":["dnd:MagicSchool"]},{"id":"dnd:Necromancy","label":"Necromancy","comment":"","parents":["dnd:MagicSchool"]},{"id":"dnd:Evocation","label":"Evocation","comment":"","parents":["dnd:MagicSchool"]},{"id":"dnd:Abjuration","label":"Abjuration","comment":"","parents":["dnd:MagicSchool"]},{"id":"dnd:Transmutation","label":"Transmutation","comment":"","parents":["dnd:MagicSchool"]},{"id":"dnd:Divination","label":"Divination","comment":"Your magic and an offering put you in contact with a god or a god's servants. You ask a single question concerning a specific goal, event, or activity to occur within 7 days. The DM offers a truthful reply. The reply might be a short phrase, a cryptic rhyme, or an omen.","parents":["dnd:MagicSchool","ttrpg:Spell"]},{"id":"dnd:Enchantment","label":"Enchantment","comment":"","parents":["dnd:MagicSchool"]},{"id":"dnd:Illusion","label":"Illusion","comment":"","parents":["dnd:MagicSchool"]},{"id":"dnd:AcidArrow","label":"Acid Arrow","comment":"A shimmering green arrow streaks toward a target within range and bursts in a spray of acid. Make a ranged spell attack against the target. On a hit, the target takes 4d4 acid damage immediately and 2d4 acid damage at the end of its next turn. On a miss, the arrow splashes the target with acid for half as much of the initial damage and no damage at the end of its next turn.","parents":["ttrpg:Spell"]},{"id":"dnd:AcidSplash","label":"Acid Splash","comment":"You hurl a bubble of acid. Choose one creature within range, or choose two creatures within range that are within 5 feet of each other. A target must succeed on a dexterity saving throw or take 1d6 acid damage.","parents":["ttrpg:Spell"]},{"id":"dnd:Aid","label":"Aid","comment":"Your spell bolsters your allies with toughness and resolve. Choose up to three creatures within range. Each target's hit point maximum and current hit points increase by 5 for the duration.","parents":["ttrpg:Spell"]},{"id":"dnd:Alarm","label":"Alarm","comment":"You set an alarm against unwanted intrusion. Choose a door, a window, or an area within range that is no larger than a 20-foot cube. Until the spell ends, an alarm alerts you whenever a Tiny or larger creature touches or enters the warded area. When you cast the spell, you can designate creatures that won't set off the alarm. You also choose whether the alarm is mental or audible.","parents":["ttrpg:Spell"]},{"id":"dnd:AlterSelf","label":"Alter Self","comment":"You assume a different form. When you cast the spell, choose one of the following options, the effects of which last for the duration of the spell. While the spell lasts, you can end one option as an action to gain the benefits of a different one.","parents":["ttrpg:Spell"]},{"id":"dnd:AnimalFriendship","label":"Animal Friendship","comment":"This spell lets you convince a beast that you mean it no harm. Choose a beast that you can see within range. It must see and hear you. If the beast's Intelligence is 4 or higher, the spell fails. Otherwise, the beast must succeed on a wisdom saving throw or be charmed by you for the spell's duration. If you or one of your companions harms the target, the spells ends.","parents":["ttrpg:Spell"]},{"id":"dnd:AnimalMessenger","label":"Animal Messenger","comment":"By means of this spell, you use an animal to deliver a message. Choose a Tiny beast you can see within range, such as a squirrel, a blue jay, or a bat. You specify a location, which you must have visited, and a recipient who matches a general description, such as 'a man or woman dressed in the uniform of the town guard' or 'a red-haired dwarf wearing a pointed hat.' You also speak a message of up to twenty-five words. The target beast travels for the duration of the spell toward the specified location, covering about 50 miles per 24 hours for a flying messenger, or 25 miles for other animals.","parents":["ttrpg:Spell"]},{"id":"dnd:AnimalShapes","label":"Animal Shapes","comment":"Your magic turns others into beasts. Choose any number of willing creatures that you can see within range. You transform each target into the form of a Large or smaller beast with a challenge rating of 4 or lower. On subsequent turns, you can use your action to transform affected creatures into new forms.","parents":["ttrpg:Spell"]},{"id":"dnd:AnimateDead","label":"Animate Dead","comment":"This spell creates an undead servant. Choose a pile of bones or a corpse of a Medium or Small humanoid within range. Your spell imbues the target with a foul mimicry of life, raising it as an undead creature. The target becomes a skeleton if you chose bones or a zombie if you chose a corpse (the DM has the creature's game statistics).","parents":["ttrpg:Spell"]},{"id":"dnd:AnimateObjects","label":"Animate Objects","comment":"Objects come to life at your command. Choose up to ten nonmagical objects within range that are not being worn or carried. Medium targets count as two objects, Large targets count as four objects, Huge targets count as eight objects. You can't animate any object larger than Huge. Each target animates and becomes a creature under your control until the spell ends or until reduced to 0 hit points.","parents":["ttrpg:Spell"]},{"id":"dnd:AntilifeShell","label":"Antilife Shell","comment":"A shimmering barrier extends out from you in a 10-foot radius and moves with you, remaining centered on you and hedging out creatures other than undead and constructs. The barrier lasts for the duration.","parents":["ttrpg:Spell"]},{"id":"dnd:AntimagicField","label":"Antimagic Field","comment":"A 10-foot-radius invisible sphere of antimagic surrounds you. This area is divorced from the magical energy that suffuses the multiverse. Within the sphere, spells can't be cast, summoned creatures disappear, and even magic items become mundane. Until the spell ends, the sphere moves with you, centered on you.","parents":["ttrpg:Spell"]},{"id":"dnd:AntipathySympathy","label":"Antipathy Sympathy","comment":"This spell attracts or repels creatures of your choice. You target something within range, either a Huge or smaller object or creature or an area that is no larger than a 200-foot cube. Then specify a kind of intelligent creature, such as red dragons, goblins, or vampires. You invest the target with an aura that either attracts or repels the specified creatures for the duration. Choose antipathy or sympathy as the aura's effect.","parents":["ttrpg:Spell"]},{"id":"dnd:ArcaneEye","label":"Arcane Eye","comment":"You create an invisible, magical eye within range that hovers in the air for the duration.","parents":["ttrpg:Spell"]},{"id":"dnd:ArcaneHand","label":"Arcane Hand","comment":"You create a Large hand of shimmering, translucent force in an unoccupied space that you can see within range. The hand lasts for the spell's duration, and it moves at your command, mimicking the movements of your own hand.","parents":["ttrpg:Spell"]},{"id":"dnd:ArcaneLock","label":"Arcane Lock","comment":"You touch a closed door, window, gate, chest, or other entryway, and it becomes locked for the duration. You and the creatures you designate when you cast this spell can open the object normally. You can also set a password that, when spoken within 5 feet of the object, suppresses this spell for 1 minute. Otherwise, it is impassable until it is broken or the spell is dispelled or suppressed. Casting knock on the object suppresses arcane lock for 10 minutes.","parents":["ttrpg:Spell"]},{"id":"dnd:ArcaneSword","label":"Arcane Sword","comment":"You create a sword-shaped plane of force that hovers within range. It lasts for the duration.","parents":["ttrpg:Spell"]},{"id":"dnd:ArcanistsMagicAura","label":"Arcanists Magic Aura","comment":"You place an illusion on a creature or an object you touch so that divination spells reveal false information about it. The target can be a willing creature or an object that isn't being carried or worn by another creature.","parents":["ttrpg:Spell"]},{"id":"dnd:AstralProjection","label":"Astral Projection","comment":"You and up to eight willing creatures within range project your astral bodies into the Astral Plane (the spell fails and the casting is wasted if you are already on that plane). The material body you leave behind is unconscious and in a state of suspended animation; it doesn't need food or air and doesn't age.","parents":["ttrpg:Spell"]},{"id":"dnd:Augury","label":"Augury","comment":"By casting gem-inlaid sticks, rolling dragon bones, laying out ornate cards, or employing some other divining tool, you receive an omen from an otherworldly entity about the results of a specific course of action that you plan to take within the next 30 minutes. The DM chooses from the following possible omens:","parents":["ttrpg:Spell"]},{"id":"dnd:Awaken","label":"Awaken","comment":"After spending the casting time tracing magical pathways within a precious gemstone, you touch a Huge or smaller beast or plant. The target must have either no Intelligence score or an Intelligence of 3 or less. The target gains an Intelligence of 10. The target also gains the ability to speak one language you know. If the target is a plant, it gains the ability to move its limbs, roots, vines, creepers, and so forth, and it gains senses similar to a human's. Your DM chooses statistics appropriate for the awakened plant, such as the statistics for the awakened shrub or the awakened tree.","parents":["ttrpg:Spell"]},{"id":"dnd:Bane","label":"Bane","comment":"Up to three creatures of your choice that you can see within range must make charisma saving throws. Whenever a target that fails this saving throw makes an attack roll or a saving throw before the spell ends, the target must roll a d4 and subtract the number rolled from the attack roll or saving throw.","parents":["ttrpg:Spell"]},{"id":"dnd:Banishment","label":"Banishment","comment":"You attempt to send one creature that you can see within range to another plane of existence. The target must succeed on a charisma saving throw or be banished.","parents":["ttrpg:Spell"]},{"id":"dnd:Barkskin","label":"Barkskin","comment":"You touch a willing creature. Until the spell ends, the target's skin has a rough, bark-like appearance, and the target's AC can't be less than 16, regardless of what kind of armor it is wearing.","parents":["ttrpg:Spell"]},{"id":"dnd:BeaconOfHope","label":"Beacon Of Hope","comment":"This spell bestows hope and vitality. Choose any number of creatures within range. For the duration, each target has advantage on wisdom saving throws and death saving throws, and regains the maximum number of hit points possible from any healing.","parents":["ttrpg:Spell"]},{"id":"dnd:BestowCurse","label":"Bestow Curse","comment":"You touch a creature, and that creature must succeed on a wisdom saving throw or become cursed for the duration of the spell. When you cast this spell, choose the nature of the curse from the following options:","parents":["ttrpg:Spell"]},{"id":"dnd:BlackTentacles","label":"Black Tentacles","comment":"Squirming, ebony tentacles fill a 20-foot square on ground that you can see within range. For the duration, these tentacles turn the ground in the area into difficult terrain.","parents":["ttrpg:Spell"]},{"id":"dnd:BladeBarrier","label":"Blade Barrier","comment":"You create a vertical wall of whirling, razor-sharp blades made of magical energy. The wall appears within range and lasts for the duration. You can make a straight wall up to 100 feet long, 20 feet high, and 5 feet thick, or a ringed wall up to 60 feet in diameter, 20 feet high, and 5 feet thick. The wall provides three-quarters cover to creatures behind it, and its space is difficult terrain.","parents":["ttrpg:Spell"]},{"id":"dnd:Bless","label":"Bless","comment":"You bless up to three creatures of your choice within range. Whenever a target makes an attack roll or a saving throw before the spell ends, the target can roll a d4 and add the number rolled to the attack roll or saving throw.","parents":["ttrpg:Spell"]},{"id":"dnd:Blight","label":"Blight","comment":"Necromantic energy washes over a creature of your choice that you can see within range, draining moisture and vitality from it. The target must make a constitution saving throw. The target takes 8d8 necrotic damage on a failed save, or half as much damage on a successful one. The spell has no effect on undead or constructs.","parents":["ttrpg:Spell"]},{"id":"dnd:BlindnessDeafness","label":"Blindness Deafness","comment":"You can blind or deafen a foe. Choose one creature that you can see within range to make a constitution saving throw. If it fails, the target is either blinded or deafened (your choice) for the duration. At the end of each of its turns, the target can make a constitution saving throw. On a success, the spell ends.","parents":["ttrpg:Spell"]},{"id":"dnd:Blink","label":"Blink","comment":"Roll a d20 at the end of each of your turns for the duration of the spell. On a roll of 11 or higher, you vanish from your current plane of existence and appear in the Ethereal Plane (the spell fails and the casting is wasted if you were already on that plane). At the start of your next turn, and when the spell ends if you are on the Ethereal Plane, you return to an unoccupied space of your choice that you can see within 10 feet of the space you vanished from. If no unoccupied space is available within that range, you appear in the nearest unoccupied space (chosen at random if more than one space is equally near). You can dismiss this spell as an action.","parents":["ttrpg:Spell"]},{"id":"dnd:Blur","label":"Blur","comment":"Your body becomes blurred, shifting and wavering to all who can see you. For the duration, any creature has disadvantage on attack rolls against you. An attacker is immune to this effect if it doesn't rely on sight, as with blindsight, or can see through illusions, as with truesight.","parents":["ttrpg:Spell"]},{"id":"dnd:BrandingSmite","label":"Branding Smite","comment":"The next time you hit a creature with a weapon attack before this spell ends, the weapon gleams with astral radiance as you strike. The attack deals an extra 2d6 radiant damage to the target, which becomes visible if it's invisible, and the target sheds dim light in a 5-foot radius and can't become invisible until the spell ends.","parents":["ttrpg:Spell"]},{"id":"dnd:BurningHands","label":"Burning Hands","comment":"As you hold your hands with thumbs touching and fingers spread, a thin sheet of flames shoots forth from your outstretched fingertips. Each creature in a 15-foot cone must make a dexterity saving throw. A creature takes 3d6 fire damage on a failed save, or half as much damage on a successful one.","parents":["ttrpg:Spell"]},{"id":"dnd:CallLightning","label":"Call Lightning","comment":"A storm cloud appears in the shape of a cylinder that is 10 feet tall with a 60-foot radius, centered on a point you can see 100 feet directly above you. The spell fails if you can't see a point in the air where the storm cloud could appear (for example, if you are in a room that can't accommodate the cloud).","parents":["ttrpg:Spell"]},{"id":"dnd:CalmEmotions","label":"Calm Emotions","comment":"You attempt to suppress strong emotions in a group of people. Each humanoid in a 20-foot-radius sphere centered on a point you choose within range must make a charisma saving throw; a creature can choose to fail this saving throw if it wishes. If a creature fails its saving throw, choose one of the following two effects. You can suppress any effect causing a target to be charmed or frightened. When this spell ends, any suppressed effect resumes, provided that its duration has not expired in the meantime.","parents":["ttrpg:Spell"]},{"id":"dnd:ChainLightning","label":"Chain Lightning","comment":"You create a bolt of lightning that arcs toward a target of your choice that you can see within range. Three bolts then leap from that target to as many as three other targets, each of which must be within 30 feet of the first target. A target can be a creature or an object and can be targeted by only one of the bolts.","parents":["ttrpg:Spell"]},{"id":"dnd:CharmPerson","label":"Charm Person","comment":"You attempt to charm a humanoid you can see within range. It must make a wisdom saving throw, and does so with advantage if you or your companions are fighting it. If it fails the saving throw, it is charmed by you until the spell ends or until you or your companions do anything harmful to it. The charmed creature regards you as a friendly acquaintance. When the spell ends, the creature knows it was charmed by you.","parents":["ttrpg:Spell"]},{"id":"dnd:ChillTouch","label":"Chill Touch","comment":"You create a ghostly, skeletal hand in the space of a creature within range. Make a ranged spell attack against the creature to assail it with the chill of the grave. On a hit, the target takes 1d8 necrotic damage, and it can't regain hit points until the start of your next turn. Until then, the hand clings to the target.","parents":["ttrpg:Spell"]},{"id":"dnd:CircleOfDeath","label":"Circle Of Death","comment":"A sphere of negative energy ripples out in a 60-foot radius sphere from a point within range. Each creature in that area must make a constitution saving throw. A target takes 8d6 necrotic damage on a failed save, or half as much damage on a successful one.","parents":["ttrpg:Spell"]},{"id":"dnd:Clairvoyance","label":"Clairvoyance","comment":"You create an invisible sensor within range in a location familiar to you (a place you have visited or seen before) or in an obvious location that is unfamiliar to you (such as behind a door, around a corner, or in a grove of trees). The sensor remains in place for the duration, and it can't be attacked or otherwise interacted with.","parents":["ttrpg:Spell"]},{"id":"dnd:Clone","label":"Clone","comment":"This spell grows an inert duplicate of a living creature as a safeguard against death. This clone forms inside a sealed vessel and grows to full size and maturity after 120 days; you can also choose to have the clone be a younger version of the same creature. It remains inert and endures indefinitely, as long as its vessel remains undisturbed.","parents":["ttrpg:Spell"]},{"id":"dnd:Cloudkill","label":"Cloudkill","comment":"You create a 20-foot-radius sphere of poisonous, yellow-green fog centered on a point you choose within range. The fog spreads around corners. It lasts for the duration or until strong wind disperses the fog, ending the spell. Its area is heavily obscured.","parents":["ttrpg:Spell"]},{"id":"dnd:ColorSpray","label":"Color Spray","comment":"A dazzling array of flashing, colored light springs from your hand. Roll 6d10; the total is how many hit points of creatures this spell can effect. Creatures in a 15-foot cone originating from you are affected in ascending order of their current hit points (ignoring unconscious creatures and creatures that can't see).","parents":["ttrpg:Spell"]},{"id":"dnd:Command","label":"Command","comment":"You speak a one-word command to a creature you can see within range. The target must succeed on a wisdom saving throw or follow the command on its next turn. The spell has no effect if the target is undead, if it doesn't understand your language, or if your command is directly harmful to it.","parents":["ttrpg:Spell"]},{"id":"dnd:Commune","label":"Commune","comment":"You contact your deity or a divine proxy and ask up to three questions that can be answered with a yes or no. You must ask your questions before the spell ends. You receive a correct answer for each question.","parents":["ttrpg:Spell"]},{"id":"dnd:CommuneWithNature","label":"Commune With Nature","comment":"You briefly become one with nature and gain knowledge of the surrounding territory. In the outdoors, the spell gives you knowledge of the land within 3 miles of you. In caves and other natural underground settings, the radius is limited to 300 feet. The spell doesn't function where nature has been replaced by construction, such as in dungeons and towns.","parents":["ttrpg:Spell"]},{"id":"dnd:ComprehendLanguages","label":"Comprehend Languages","comment":"For the duration, you understand the literal meaning of any spoken language that you hear. You also understand any written language that you see, but you must be touching the surface on which the words are written. It takes about 1 minute to read one page of text.","parents":["ttrpg:Spell"]},{"id":"dnd:Compulsion","label":"Compulsion","comment":"Creatures of your choice that you can see within range and that can hear you must make a wisdom saving throw. A target automatically succeeds on this saving throw if it can't be charmed. On a failed save, a target is affected by this spell. Until the spell ends, you can use a bonus action on each of your turns to designate a direction that is horizontal to you. Each affected target must use as much of its movement as possible to move in that direction on its next turn. It can take any action before it moves. After moving in this way, it can make another Wisdom save to try to end the effect.","parents":["ttrpg:Spell"]},{"id":"dnd:ConeOfCold","label":"Cone Of Cold","comment":"A blast of cold air erupts from your hands. Each creature in a 60-foot cone must make a constitution saving throw. A creature takes 8d8 cold damage on a failed save, or half as much damage on a successful one.","parents":["ttrpg:Spell"]},{"id":"dnd:Confusion","label":"Confusion","comment":"This spell assaults and twists creatures' minds, spawning delusions and provoking uncontrolled action. Each creature in a 10-foot-radius sphere centered on a point you choose within range must succeed on a Wisdom saving throw when you cast this spell or be affected by it.","parents":["ttrpg:Spell"]},{"id":"dnd:ConjureAnimals","label":"Conjure Animals","comment":"You summon fey spirits that take the form of beasts and appear in unoccupied spaces that you can see within range. Choose one of the following options for what appears:","parents":["ttrpg:Spell"]},{"id":"dnd:ConjureCelestial","label":"Conjure Celestial","comment":"You summon a celestial of challenge rating 4 or lower, which appears in an unoccupied space that you can see within range. The celestial disappears when it drops to 0 hit points or when the spell ends.","parents":["ttrpg:Spell"]},{"id":"dnd:ConjureElemental","label":"Conjure Elemental","comment":"You call forth an elemental servant. Choose an area of air, earth, fire, or water that fills a 10-foot cube within range. An elemental of challenge rating 5 or lower appropriate to the area you chose appears in an unoccupied space within 10 feet of it. For example, a fire elemental emerges from a bonfire, and an earth elemental rises up from the ground. The elemental disappears when it drops to 0 hit points or when the spell ends.","parents":["ttrpg:Spell"]},{"id":"dnd:ConjureFey","label":"Conjure Fey","comment":"You summon a fey creature of challenge rating 6 or lower, or a fey spirit that takes the form of a beast of challenge rating 6 or lower. It appears in an unoccupied space that you can see within range. The fey creature disappears when it drops to 0 hit points or when the spell ends.","parents":["ttrpg:Spell"]},{"id":"dnd:ConjureMinorElementals","label":"Conjure Minor Elementals","comment":"You summon elementals that appear in unoccupied spaces that you can see within range. You choose one the following options for what appears:","parents":["ttrpg:Spell"]},{"id":"dnd:ConjureWoodlandBeings","label":"Conjure Woodland Beings","comment":"You summon fey creatures that appear in unoccupied spaces that you can see within range. Choose one of the following options for what appears:","parents":["ttrpg:Spell"]},{"id":"dnd:ContactOtherPlane","label":"Contact Other Plane","comment":"You mentally contact a demigod, the spirit of a long-dead sage, or some other mysterious entity from another plane. Contacting this extraplanar intelligence can strain or even break your mind. When you cast this spell, make a DC 15 intelligence saving throw. On a failure, you take 6d6 psychic damage and are insane until you finish a long rest. While insane, you can't take actions, can't understand what other creatures say, can't read, and speak only in gibberish. A greater restoration spell cast on you ends this effect.","parents":["ttrpg:Spell"]},{"id":"dnd:Contagion","label":"Contagion","comment":"Your touch inflicts disease. Make a melee spell attack against a creature within your reach. On a hit, you afflict the creature with a disease of your choice from any of the ones described below.","parents":["ttrpg:Spell"]},{"id":"dnd:Contingency","label":"Contingency","comment":"Choose a spell of 5th level or lower that you can cast, that has a casting time of 1 action, and that can target you. You cast that spell--called the contingent spell--as part of casting contingency, expending spell slots for both, but the contingent spell doesn't come into effect. Instead, it takes effect when a certain circumstance occurs. You describe that circumstance when you cast the two spells. For example, a contingency cast with water breathing might stipulate that water breathing comes into effect when you are engulfed in water or a similar liquid.","parents":["ttrpg:Spell"]},{"id":"dnd:ContinualFlame","label":"Continual Flame","comment":
