":"Stinking Cloud","comment":"You create a 20-foot-radius sphere of yellow, nauseating gas centered on a point within range. The cloud spreads around corners, and its area is heavily obscured. The cloud lingers in the air for the duration.","parents":["ttrpg:Spell"]},{"id":"dnd:StoneShape","label":"Stone Shape","comment":"You touch a stone object of Medium size or smaller or a section of stone no more than 5 feet in any dimension and form it into any shape that suits your purpose. So, for example, you could shape a large rock into a weapon, idol, or coffer, or make a small passage through a wall, as long as the wall is less than 5 feet thick. You could also shape a stone door or its frame to seal the door shut. The object you create can have up to two hinges and a latch, but finer mechanical detail isn't possible.","parents":["ttrpg:Spell"]},{"id":"dnd:Stoneskin","label":"Stoneskin","comment":"This spell turns the flesh of a willing creature you touch as hard as stone. Until the spell ends, the target has resistance to nonmagical bludgeoning, piercing, and slashing damage.","parents":["ttrpg:Spell"]},{"id":"dnd:StormOfVengeance","label":"Storm Of Vengeance","comment":"A churning storm cloud forms, centered on a point you can see and spreading to a radius of 360 feet. Lightning flashes in the area, thunder booms, and strong winds roar. Each creature under the cloud (no more than 5,000 feet beneath the cloud) when it appears must make a constitution saving throw. On a failed save, a creature takes 2d6 thunder damage and becomes deafened for 5 minutes.","parents":["ttrpg:Spell"]},{"id":"dnd:Suggestion","label":"Suggestion","comment":"You suggest a course of activity (limited to a sentence or two) and magically influence a creature you can see within range that can hear and understand you. Creatures that can't be charmed are immune to this effect. The suggestion must be worded in such a manner as to make the course of action sound reasonable. Asking the creature to stab itself, throw itself onto a spear, immolate itself, or do some other obviously harmful act ends the spell.","parents":["ttrpg:Spell"]},{"id":"dnd:Sunbeam","label":"Sunbeam","comment":"A beam of brilliant light flashes out from your hand in a 5-foot-wide, 60-foot-long line. Each creature in the line must make a constitution saving throw. On a failed save, a creature takes 6d8 radiant damage and is blinded until your next turn. On a successful save, it takes half as much damage and isn't blinded by this spell. Undead and oozes have disadvantage on this saving throw.","parents":["ttrpg:Spell"]},{"id":"dnd:Sunburst","label":"Sunburst","comment":"Brilliant sunlight flashes in a 60-foot radius centered on a point you choose within range. Each creature in that light must make a constitution saving throw. On a failed save, a creature takes 12d6 radiant damage and is blinded for 1 minute. On a successful save, it takes half as much damage and isn't blinded by this spell. Undead and oozes have disadvantage on this saving throw.","parents":["ttrpg:Spell"]},{"id":"dnd:Symbol","label":"Symbol","comment":"When you cast this spell, you inscribe a harmful glyph either on a surface (such as a section of floor, a wall, or a table) or within an object that can be closed to conceal the glyph (such as a book, a scroll, or a treasure chest). If you choose a surface, the glyph can cover an area of the surface no larger than 10 feet in diameter. If you choose an object, that object must remain in its place; if the object is moved more than 10 feet from where you cast this spell, the glyph is broken, and the spell ends without being triggered.","parents":["ttrpg:Spell"]},{"id":"dnd:Telekinesis","label":"Telekinesis","comment":"You gain the ability to move or manipulate creatures or objects by thought. When you cast the spell, and as your action each round for the duration, you can exert your will on one creature or object that you can see within range, causing the appropriate effect below. You can affect the same target round after round, or choose a new one at any time. If you switch targets, the prior target is no longer affected by the spell.","parents":["ttrpg:Spell"]},{"id":"dnd:TelepathicBond","label":"Telepathic Bond","comment":"You forge a telepathic link among up to eight willing creatures of your choice within range, psychically linking each creature to all the others for the duration. Creatures with Intelligence scores of 2 or less aren't affected by this spell.","parents":["ttrpg:Spell"]},{"id":"dnd:Teleport","label":"Teleport","comment":"This spell instantly transports you and up to eight willing creatures of your choice that you can see within range, or a single object that you can see within range, to a destination you select. If you target an object, it must be able to fit entirely inside a 10-foot cube, and it can't be held or carried by an unwilling creature.","parents":["ttrpg:Spell"]},{"id":"dnd:TeleportationCircle","label":"Teleportation Circle","comment":"As you cast the spell, you draw a 10-foot-diameter circle on the ground inscribed with sigils that link your location to a permanent teleportation circle of your choice whose sigil sequence you know and that is on the same plane of existence as you. A shimmering portal opens within the circle you drew and remains open until the end of your next turn. Any creature that enters the portal instantly appears within 5 feet of the destination circle or in the nearest unoccupied space if that space is occupied.","parents":["ttrpg:Spell"]},{"id":"dnd:Thaumaturgy","label":"Thaumaturgy","comment":"You manifest a minor wonder, a sign of supernatural power, within range. You create one of the following magical effects within range.","parents":["ttrpg:Spell"]},{"id":"dnd:Thunderwave","label":"Thunderwave","comment":"A wave of thunderous force sweeps out from you. Each creature in a 15-foot cube originating from you must make a constitution saving throw. On a failed save, a creature takes 2d8 thunder damage and is pushed 10 feet away from you. On a successful save, the creature takes half as much damage and isn't pushed.","parents":["ttrpg:Spell"]},{"id":"dnd:TimeStop","label":"Time Stop","comment":"You briefly stop the flow of time for everyone but yourself. No time passes for other creatures, while you take 1d4 + 1 turns in a row, during which you can use actions and move as normal.","parents":["ttrpg:Spell"]},{"id":"dnd:TinyHut","label":"Tiny Hut","comment":"A 10-foot-radius immobile dome of force springs into existence around and above you and remains stationary for the duration. The spell ends if you leave its area.","parents":["ttrpg:Spell"]},{"id":"dnd:Tongues","label":"Tongues","comment":"This spell grants the creature you touch the ability to understand any spoken language it hears. Moreover, when the target speaks, any creature that knows at least one language and can hear the target understands what it says.","parents":["ttrpg:Spell"]},{"id":"dnd:TransportViaPlants","label":"Transport Via Plants","comment":"This spell creates a magical link between a Large or larger inanimate plant within range and another plant, at any distance, on the same plane of existence. You must have seen or touched the destination plant at least once before. For the duration, any creature can step into the target plant and exit from the destination plant by using 5 feet of movement.","parents":["ttrpg:Spell"]},{"id":"dnd:TreeStride","label":"Tree Stride","comment":"You gain the ability to enter a tree and move from inside it to inside another tree of the same kind within 500 feet. Both trees must be living and at least the same size as you. You must use 5 feet of movement to enter a tree. You instantly know the location of all other trees of the same kind within 500 feet and, as part of the move used to enter the tree, can either pass into one of those trees or step out of the tree you're in. You appear in a spot of your choice within 5 feet of the destination tree, using another 5 feet of movement. If you have no movement left, you appear within 5 feet of the tree you entered.","parents":["ttrpg:Spell"]},{"id":"dnd:TruePolymorph","label":"True Polymorph","comment":"Choose one creature or nonmagical object that you can see within range. You transform the creature into a different creature, the creature into an object, or the object into a creature (the object must be neither worn nor carried by another creature). The transformation lasts for the duration, or until the target drops to 0 hit points or dies. If you concentrate on this spell for the full duration, the transformation becomes permanent.","parents":["ttrpg:Spell"]},{"id":"dnd:TrueResurrection","label":"True Resurrection","comment":"You touch a creature that has been dead for no longer than 200 years and that died for any reason except old age. If the creature's soul is free and willing, the creature is restored to life with all its hit points.","parents":["ttrpg:Spell"]},{"id":"dnd:TrueSeeing","label":"True Seeing","comment":"This spell gives the willing creature you touch the ability to see things as they actually are. For the duration, the creature has truesight, notices secret doors hidden by magic, and can see into the Ethereal Plane, all out to a range of 120 feet.","parents":["ttrpg:Spell"]},{"id":"dnd:TrueStrike","label":"True Strike","comment":"You extend your hand and point a finger at a target in range. Your magic grants you a brief insight into the target's defenses. On your next turn, you gain advantage on your first attack roll against the target, provided that this spell hasn't ended.","parents":["ttrpg:Spell"]},{"id":"dnd:UnseenServant","label":"Unseen Servant","comment":"This spell creates an invisible, mindless, shapeless force that performs simple tasks at your command until the spell ends. The servant springs into existence in an unoccupied space on the ground within range. It has AC 10, 1 hit point, and a Strength of 2, and it can't attack. If it drops to 0 hit points, the spell ends.","parents":["ttrpg:Spell"]},{"id":"dnd:VampiricTouch","label":"Vampiric Touch","comment":"The touch of your shadow-wreathed hand can siphon life force from others to heal your wounds. Make a melee spell attack against a creature within your reach. On a hit, the target takes 3d6 necrotic damage, and you regain hit points equal to half the amount of necrotic damage dealt. Until the spell ends, you can make the attack again on each of your turns as an action.","parents":["ttrpg:Spell"]},{"id":"dnd:ViciousMockery","label":"Vicious Mockery","comment":"You unleash a string of insults laced with subtle enchantments at a creature you can see within range. If the target can hear you (though it need not understand you), it must succeed on a wisdom saving throw or take 1d4 psychic damage and have disadvantage on the next attack roll it makes before the end of its next turn.","parents":["ttrpg:Spell"]},{"id":"dnd:WallOfFire","label":"Wall Of Fire","comment":"You create a wall of fire on a solid surface within range. You can make the wall up to 60 feet long, 20 feet high, and 1 foot thick, or a ringed wall up to 20 feet in diameter, 20 feet high, and 1 foot thick. The wall is opaque and lasts for the duration.","parents":["ttrpg:Spell"]},{"id":"dnd:WallOfForce","label":"Wall Of Force","comment":"An invisible wall of force springs into existence at a point you choose within range. The wall appears in any orientation you choose, as a horizontal or vertical barrier or at an angle. It can be free floating or resting on a solid surface. You can form it into a hemispherical dome or a sphere with a radius of up to 10 feet, or you can shape a flat surface made up of ten 10-foot-by-10-foot panels. Each panel must be contiguous with another panel. In any form, the wall is 1/4 inch thick. It lasts for the duration. If the wall cuts through a creature's space when it appears, the creature is pushed to one side of the wall (your choice which side).","parents":["ttrpg:Spell"]},{"id":"dnd:WallOfIce","label":"Wall Of Ice","comment":"You create a wall of ice on a solid surface within range. You can form it into a hemispherical dome or a sphere with a radius of up to 10 feet, or you can shape a flat surface made up of ten 10-foot-square panels. Each panel must be contiguous with another panel. In any form, the wall is 1 foot thick and lasts for the duration.","parents":["ttrpg:Spell"]},{"id":"dnd:WallOfStone","label":"Wall Of Stone","comment":"A nonmagical wall of solid stone springs into existence at a point you choose within range. The wall is 6 inches thick and is composed of ten 10-foot-by-10-foot panels. Each panel must be contiguous with at least one other panel. Alternatively, you can create 10-foot-by-20-foot panels that are only 3 inches thick.","parents":["ttrpg:Spell"]},{"id":"dnd:WallOfThorns","label":"Wall Of Thorns","comment":"You create a wall of tough, pliable, tangled brush bristling with needle-sharp thorns. The wall appears within range on a solid surface and lasts for the duration. You choose to make the wall up to 60 feet long, 10 feet high, and 5 feet thick or a circle that has a 20-foot diameter and is up to 20 feet high and 5 feet thick. The wall blocks line of sight.","parents":["ttrpg:Spell"]},{"id":"dnd:WardingBond","label":"Warding Bond","comment":"This spell wards a willing creature you touch and creates a mystic connection between you and the target until the spell ends. While the target is within 60 feet of you, it gains a +1 bonus to AC and saving throws, and it has resistance to all damage. Also, each time it takes damage, you take the same amount of damage.","parents":["ttrpg:Spell"]},{"id":"dnd:WaterBreathing","label":"Water Breathing","comment":"This spell gives a maximum of ten willing creatures within range and you can see, the ability to breathe underwater until the end of its term. Affected creatures also retain their normal breathing pattern.","parents":["ttrpg:Spell"]},{"id":"dnd:WaterWalk","label":"Water Walk","comment":"This spell grants the ability to move across any liquid surface--such as water, acid, mud, snow, quicksand, or lava--as if it were harmless solid ground (creatures crossing molten lava can still take damage from the heat). Up to ten willing creatures you can see within range gain this ability for the duration.","parents":["ttrpg:Spell"]},{"id":"dnd:Web","label":"Web","comment":"You conjure a mass of thick, sticky webbing at a point of your choice within range. The webs fill a 20-foot cube from that point for the duration. The webs are difficult terrain and lightly obscure their area.","parents":["ttrpg:Spell"]},{"id":"dnd:Weird","label":"Weird","comment":"Drawing on the deepest fears of a group of creatures, you create illusory creatures in their minds, visible only to them. Each creature in a 30-foot-radius sphere centered on a point of your choice within range must make a wisdom saving throw. On a failed save, a creature becomes frightened for the duration. The illusion calls on the creature's deepest fears, manifesting its worst nightmares as an implacable threat. At the start of each of the frightened creature's turns, it must succeed on a wisdom saving throw or take 4d10 psychic damage. On a successful save, the spell ends for that creature.","parents":["ttrpg:Spell"]},{"id":"dnd:WindWalk","label":"Wind Walk","comment":"You and up to ten willing creatures you can see within range assume a gaseous form for the duration, appearing as wisps of cloud. While in this cloud form, a creature has a flying speed of 300 feet and has resistance to damage from nonmagical weapons. The only actions a creature can take in this form are the Dash action or to revert to its normal form. Reverting takes 1 minute, during which time a creature is incapacitated and can't move. Until the spell ends, a creature can revert to cloud form, which also requires the 1-minute transformation.","parents":["ttrpg:Spell"]},{"id":"dnd:WindWall","label":"Wind Wall","comment":"A wall of strong wind rises from the ground at a point you choose within range. You can make the wall up to 50 feet long, 15 feet high, and 1 foot thick. You can shape the wall in any way you choose so long as it makes one continuous path along the ground. The wall lasts for the duration.","parents":["ttrpg:Spell"]},{"id":"dnd:Wish","label":"Wish","comment":"Wish is the mightiest spell a mortal creature can cast. By simply speaking aloud, you can alter the very foundations of reality in accord with your desires.","parents":["ttrpg:Spell"]},{"id":"dnd:WordOfRecall","label":"Word Of Recall","comment":"You and up to five willing creatures within 5 feet of you instantly teleport to a previously designated sanctuary. You and any creatures that teleport with you appear in the nearest unoccupied space to the spot you designated when you prepared your sanctuary (see below). If you cast this spell without first preparing a sanctuary, the spell has no effect.","parents":["ttrpg:Spell"]},{"id":"dnd:ZoneOfTruth","label":"Zone Of Truth","comment":"You create a magical zone that guards against deception in a 15-foot-radius sphere centered on a point of your choice within range. Until the spell ends, a creature that enters the spell's area for the first time on a turn or starts its turn there must make a Charisma saving throw. On a failed save, a creature can't speak a deliberate lie while in the radius. You know whether each creature succeeds or fails on its saving throw.","parents":["ttrpg:Spell"]},{"id":"ttrpg:CharacterType","label":"CharacterType","comment":"","parents":[]},{"id":"dnd:DraconicAncestry","label":"DraconicAncestry","comment":"","parents":[]},{"id":"dnd:Alignment","label":"Alignment","comment":"","parents":[]},{"id":"ttrpg:ItemType","label":"ItemType","comment":"","parents":[]},{"id":"ttrpg:ItemEnhancement","label":"ItemEnhancement","comment":"","parents":[]},{"id":"ttrpg:Weapon","label":"Weapon","comment":"","parents":[]},{"id":"ttrpg:Armor     const by = d3.group(kids.get(t.ref) || [], id => schoolOf.get(id) || '');
    out = [...by].sort((a, b) => lbl(a[0]).localeCompare(lbl(b[0]))).map(([school, ids]) => {
      const g = mk('group', null, school ? lbl(school) : 'No school', t.cat, t);
      g.key = t.key + '/school:' + school; g.school = school; g.members = ids; return g;
    });
  } else out = (kids.get(t.ref) || []).filter(id => !t.anc.has(id)).map(id => mk('class', id, lbl(id), t.cat, t));
  return (t._kids = out);
}
const nKids = t => t.kind === 'group' ? t.members.length : t.kind === 'class' ? (kids.get(t.ref) || []).length : getKids(t).length;

/* ---------- tree view ---------- */
const tsvg = d3.select('#tree-svg');
const tg = tsvg.append('g');
const gLinks = tg.append('g'), gNodes = tg.append('g');
const tzoom = d3.zoom().scaleExtent([0.15, 3]).on('zoom', e => tg.attr('transform', e.transform));
tsvg.call(tzoom).on('dblclick.zoom', null);
let selected = null, lastPos = new Map();
const DX = 22, DY = 200;

function renderTree(sourceKey) {
  const h = d3.hierarchy(ROOT, t => t.open ? getKids(t) : null);
  d3.tree().nodeSize([DX, DY]).separation((a, b) => a.parent === b.parent ? 1 : 1.25)(h);
  const nodes = h.descendants(), links = h.links();
  const src = lastPos.get(sourceKey) || { x: 0, y: 0 };
  const srcNew = nodes.find(n => n.data.key === sourceKey) || h;
  const dur = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 320;
  const T = tsvg.transition().duration(dur);
  const diag = d3.linkHorizontal().x(d => d.y).y(d => d.x);

  gLinks.selectAll('path').data(links, d => d.target.data.key).join(
    enter => enter.append('path').attr('class', 'link').attr('d', () => diag({ source: src, target: src })),
    update => update,
    exit => exit.transition(T).attr('d', () => diag({ source: srcNew, target: srcNew })).remove()
  ).transition(T).attr('d', diag);

  const node = gNodes.selectAll('g.node').data(nodes, d => d.data.key).join(
    enter => {
      const g = enter.append('g').attr('transform', `translate(${src.y},${src.x})`).attr('opacity', 0)
        .attr('tabindex', 0).attr('role', 'button');
      g.append('circle').attr('r', 5);
      g.append('text');
      g.on('click', (e, d) => onTreeClick(d.data));
      g.on('keydown', (e, d) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onTreeClick(d.data); } });
      return g;
    },
    update => update,
    exit => exit.transition(T).attr('transform', `translate(${srcNew.y},${srcNew.x})`).attr('opacity', 0).remove()
  );
  node.attr('class', d => {
    const t = d.data, n = nKids(t);
    return ['node', t.kind, t.ref ? catCls(t.ref) : 'cat-' + (t.cat || 'none'),
      n && !t.open ? 'has-hidden' : '', isSel(t) ? 'sel' : ''].join(' ');
  }).attr('aria-label', d => d.data.label);
  node.select('text').each(function (d) {
    const t = d.data, n = nKids(t), el = d3.select(this);
    const leftSide = t.kind === 'root';
    el.attr('x', leftSide ? -10 : 10).attr('text-anchor', leftSide ? 'end' : 'start').text(t.label);
    if (n && !t.open) el.append('tspan').attr('class', 'cnt').text('  ' + n);
    const np = t.ref ? (byId.get(t.ref)?.parents.length || 0) : 0;
    if (np > 1) el.append('tspan').attr('class', 'multi').text(`  ×${np} parents`);
  });
  node.transition(T).attr('opacity', 1).attr('transform', d => `translate(${d.y},${d.x})`);
  lastPos = new Map(nodes.map(n => [n.data.key, { x: n.x, y: n.y }]));
}
function isSel(t) {
  if (!selected) return false;
  if (selected.type === 'class') return t.ref === selected.id || (t.kind === 'group' && t.school === selected.id);
  if (selected.type === 'cat') return t.kind === 'cat' && t.cat === selected.id;
  return false;
}
function onTreeClick(t) {
  if (nKids(t)) t.open = !t.open;
  if (t.kind === 'class') select({ type: 'class', id: t.ref }, false, true);
  else if (t.kind === 'group') select(t.school ? { type: 'class', id: t.school } : null, false, true);
  else if (t.kind === 'cat') select({ type: 'cat', id: t.cat }, false, true);
  renderTree(t.key);
}
function centerOn(key, xFrac = 0.32) {
  const p = lastPos.get(key); if (!p) return;
  const box = tsvg.node().getBoundingClientRect();
  const k = d3.zoomTransform(tsvg.node()).k || 1;
  tsvg.transition().duration(450).call(tzoom.transform, d3.zoomIdentity.translate(box.width * xFrac - p.y * k, box.height / 2 - p.x * k).scale(k));
}
function chainTo(id) {
  const chain = [id]; const seen = new Set([id]);
  let cur = id;
  while (byId.get(cur)?.parents.length) {
    const p = byId.get(cur).parents.find(x => !seen.has(x)); if (!p) break;
    chain.unshift(p); seen.add(p); cur = p;
  }
  return chain;
}
function reveal(id) {
  const chain = chainTo(id);
  const cat = CATS.find(c => c.roots.includes(chain[0]));
  if (!cat) return;
  ROOT.open = true;
  let t = getKids(ROOT).find(k => k.cat === cat.key); t.open = true;
  for (let i = 0; i < chain.length; i++) {
    if (t.kind === 'class' && t.ref === 'ttrpg:Spell' && groupSpells) {
      const g = getKids(t).find(k => k.members.includes(chain[i])); g.open = true; t = g;
    }
    const next = getKids(t).find(k => k.ref === chain[i]); if (!next) break;
    t = next;
    if (i < chain.length - 1) t.open = true;
  }
  renderTree(t.key);
  setTimeout(() => centerOn(t.key), 340);
}
function collapseAll() {
  const walk = t => { if (t._kids) t._kids.forEach(walk); if (t.kind !== 'root') t.open = false; };
  walk(ROOT); ROOT.open = true;
  getKids(ROOT).forEach(c => c.open = true);
  renderTree('R');
  setTimeout(fitTree, 340);
}
function fitTree() {
  const b = tg.node().getBBox(), box = tsvg.node().getBoundingClientRect();
  if (!b.width || !box.width) return;
  const k = Math.min(1.1, 0.9 * Math.min(box.width / b.width, box.height / b.height));
  tsvg.transition().duration(450).call(tzoom.transform,
    d3.zoomIdentity.translate(box.width / 2 - (b.x + b.width / 2) * k, box.height / 2 - (b.y + b.height / 2) * k).scale(k));
}
document.getElementById('group-spells').addEventListener('change', e => {
  groupSpells = e.target.checked;
  const walk = t => { if (t.kind === 'class' && t.ref === 'ttrpg:Spell') t._kids = null; else (t._kids || []).forEach(walk); };
  walk(ROOT);
  renderTree('R');
});
document.getElementById('collapse').addEventListener('click', collapseAll);

/* ---------- schema view ---------- */
const ssvg = d3.select('#schema-svg');
const sg = ssvg.append('g');
const szoom = d3.zoom().scaleExtent([0.2, 3]).on('zoom', e => sg.attr('transform', e.transform));
ssvg.call(szoom).on('dblclick.zoom', null);
const defs = ssvg.append('defs');
[['arrow', ''], ['arrow-hot', '']].forEach(([id]) => defs.append('marker').attr('id', id).attr('viewBox', '0 0 10 10').attr('refX', 9).attr('refY', 5)
  .attr('markerWidth', 7).attr('markerHeight', 7).attr('orient', 'auto-start-reverse').append('path').attr('d', 'M0,0L10,5L0,10z'));
const sNodes = [...new Set(D.props.flatMap(p => [p.domain, p.range]))].map(id => ({
  id, label: byId.has(id) ? lbl(id) : id.startsWith('xsd:') || id.startsWith('owl:') ? id : id.split(':').pop(),
  dt: id.startsWith('xsd:') || id.startsWith('owl:'), ext: !byId.has(id) && !id.startsWith('xsd:') && !id.startsWith('owl:')
}));
const sIdx = new Map(sNodes.map(n => [n.id, n]));
const sLinks = D.props.map(p => ({ source: sIdx.get(p.domain), target: sIdx.get(p.range), p }));
sNodes.forEach(n => { n.w = Math.max(64, n.label.length * (n.dt ? 7.6 : 7.4) + 22); n.h = 28; });
const gE = sg.append('g'), gEL = sg.append('g'), gSN = sg.append('g');
const edge = gE.selectAll('path').data(sLinks).join('path').attr('class', 'edge').attr('marker-end', 'url(#arrow)');
const edgeLbl = gEL.selectAll('text').data(sLinks).join('text').attr('class', 'edge-label').text(d => d.p.id.split(':')[1])
  .on('click', (e, d) => select({ type: 'prop', id: d.p.id }, false));
edgeLbl.append('title').text(d => `${d.p.label}: ${lbl(d.p.domain)} → ${d.p.range}`);
const snode = gSN.selectAll('g').data(sNodes).join('g')
  .attr('class', d => ['snode', d.dt ? 'dt' : '', d.ext ? 'ext' : '', byId.has(d.id) ? catCls(d.id) : 'cat-none'].join(' '))
  .attr('tabindex', 0).attr('role', 'button').attr('aria-label', d => d.label)
  .on('click', (e, d) => { if (byId.has(d.id)) select({ type: 'class', id: d.id }, false); })
  .on('keydown', (e, d) => { if (e.key === 'Enter' && byId.has(d.id)) select({ type: 'class', id: d.id }, false); });
snode.append('rect').attr('x', d => -d.w / 2).attr('y', -14).attr('width', d => d.w).attr('height', 28);
snode.append('text').text(d => d.label);
snode.append('title').text(d => d.ext ? `${d.id} (defined in the parent TTRpg ontology)` : d.dt ? `${d.id} (literal datatype)` : d.id);
const sim = d3.forceSimulation(sNodes)
  .force('link', d3.forceLink(sLinks).distance(d => d.target.dt ? 120 : 170).strength(0.6))
  .force('charge', d3.forceManyBody().strength(-900))
  .force('collide', d3.forceCollide().radius(d => d.w / 2 + 14))
  .force('x', d3.forceX().strength(0.04)).force('y', d3.forceY().strength(0.06))
  .stop();
function edgePoint(a, b) { // where segment a→b leaves b's rectangle
  const dx = a.x - b.x, dy = a.y - b.y;
  if (!dx && !dy) return { x: b.x, y: b.y };
  const sx = (b.w / 2 + 3) / Math.abs(dx || 1e-9), sy = (b.h / 2 + 3) / Math.abs(dy || 1e-9), s = Math.min(sx, sy);
  return { x: b.x + dx * s, y: b.y + dy * s };
}
function drawSchema() {
  edge.attr('d', d => { const p = edgePoint(d.source, d.target), q = edgePoint(d.target, d.source); return `M${q.x},${q.y}L${p.x},${p.y}`; });
  edgeLbl.attr('x', d => (d.source.x + d.target.x) / 2).attr('y', d => (d.source.y + d.target.y) / 2 - 4);
  snode.attr('transform', d => `translate(${d.x},${d.y})`);
}
snode.call(d3.drag()
  .on('start', (e, d) => { d.fx = d.x; d.fy = d.y; })
  .on('drag', (e, d) => { d.fx = d.x = e.x; d.fy = d.y = e.y; drawSchema(); })
  .on('end', (e, d) => { d.fx = d.fy = null; }));
function layoutSchema() {
  sNodes.forEach((n, i) => { n.x = Math.cos(i) * 200; n.y = Math.sin(i) * 200; n.vx = n.vy = 0; });
  sim.alpha(1); for (let i = 0; i < 400; i++) sim.tick();
  drawSchema(); fitSchema();
}
function fitSchema() {
  const box = ssvg.node().getBoundingClientRect(); if (!box.width) return;
  const xs = sNodes.flatMap(n => [n.x - n.w / 2, n.x + n.w / 2]), ys = sNodes.flatMap(n => [n.y - 20, n.y + 20]);
  const [x0, x1] = d3.extent(xs), [y0, y1] = d3.extent(ys);
  const k = Math.min(1.3, 0.92 * Math.min(box.width / (x1 - x0), box.height / (y1 - y0)));
  ssvg.call(szoom.transform, d3.zoomIdentity.translate(box.width / 2 - (x0 + x1) / 2 * k, box.height / 2 - (y0 + y1) / 2 * k).scale(k));
}
function paintSchemaSel() {
  const sid = selected?.id;
  snode.classed('sel', d => d.id === sid);
  const hot = d => selected?.type === 'prop' ? d.p.id === sid : (d.source.id === sid || d.target.id === sid);
  edge.classed('hot', hot).attr('marker-end', d => hot(d) ? 'url(#arrow-hot)' : 'url(#arrow)');
  edgeLbl.classed('hot', hot);
}
let schemaLaid = false;
document.getElementById('relayout').addEventListener('click', layoutSchema);

/* ---------- tabs ---------- */
function showTab(which) {
  const tree = which === 'tree';
  document.getElementById('tab-tree').setAttribute('aria-selected', tree);
  document.getElementById('tab-schema').setAttribute('aria-selected', !tree);
  document.getElementById('tree-svg').hidden = !tree;
  document.getElementById('schema-svg').hidden = tree;
  document.getElementById('tree-opts').hidden = !tree;
  document.getElementById('schema-opts').hidden = tree;
  document.getElementById('hint').textContent = tree
    ? 'Click a node to open it · drag to pan · scroll or pinch to zoom'
    : 'Each arrow is a property, pointing from its domain to its range · drag boxes to rearrange · dashed boxes come from the TTRpg ontology';
  if (!tree && !schemaLaid) { schemaLaid = true; layoutSchema(); }
  paintSchemaSel();
}
document.getElementById('tab-tree').onclick = () => showTab('tree');
document.getElementById('tab-schema').onclick = () => showTab('schema');

/* ---------- category buttons ---------- */
const catsEl = document.getElementById('cats');
CATS.forEach(c => {
  const b = document.createElement('button');
  b.className = 'cat-btn cat-' + c.key;
  b.innerHTML = `<span class="dot"></span>${esc(c.name)} <span class="n">${catMembers.get(c.key).size}</span>`;
  b.onclick = () => {
    showTab('tree');
    const ct = getKids(ROOT).find(k => k.cat === c.key);
    getKids(ROOT).forEach(k => k.open = k === ct);
    getKids(ct).forEach(k => k.open = false);
    ROOT.open = true; ct.open = true;
    select({ type: 'cat', id: c.key }, false, true);
    renderTree(ct.key);
    setTimeout(() => centerOn(ct.key, 0.18), 340);
  };
  catsEl.appendChild(b);
});

/* ---------- detail panel ---------- */
const detail = document.getElementById('detail');
const chip = id => byId.has(id)
  ? `<button class="chip ${catCls(id)}" data-id="${esc(id)}"><span class="dot"></span>${esc(lbl(id))}</button>`
  : `<span class="chip static" title="${id.startsWith('ttrpg:') ? 'Defined in the parent TTRpg ontology' : 'Literal datatype'}">${esc(id)}</span>`;
const chipList = (ids, limit = 36, more) => {
  const shown = ids.slice(0, limit).map(chip).join('');
  return `<div class="chips">${shown}${ids.length > limit ? `<button class="chip more" data-more="${esc(more)}">+${ids.length - limit} more</button>` : ''}</div>`;
};
const IRI = id => id.startsWith('dnd:') ? 'https://w3id.org/DnD5eCharacter#' + id.slice(4) : id.startsWith('ttrpg:') ? 'https://w3id.org/TTRpg#' + id.slice(6) : id;
let expandedMore = new Set();

function renderDetail() {
  if (!selected) { detail.innerHTML = ''; return; }
  let h = '';
  if (selected.type === 'cat') {
    const c = CATS.find(x => x.key === selected.id);
    h = `<div class="kicker cat-${c.key}"><span class="dot"></span>Category</div><h2>${esc(c.name)}</h2>
      <div class="iri">${catMembers.get(c.key).size} classes under ${c.roots.length} top-level classes</div><hr class="rule">
      <p class="desc empty">Grouping added by this viewer to organise the ontology's ${allRoots.length} top-level classes. It is not part of the ontology itself.</p>
      <div class="sec"><h3>Top-level classes <span class="n">${c.roots.length}</span></h3>${chipList(c.roots)}</div>`;
  } else if (selected.type === 'prop') {
    const p = propById.get(selected.id);
    const uses = D.rels.filter(r => r[1] === p.id);
    h = `<div class="kicker cat-none"><span class="dot"></span>Property</div><h2>${esc(p.label)}</h2><div class="iri">${esc(IRI(p.id))}</div><hr class="rule">
      ${p.comment ? `<p class="desc">${esc(p.comment)}</p>` : `<p class="desc empty">No description in the ontology.</p>`}
      <div class="sec"><h3>Domain → range</h3><div class="chips">${chip(p.domain)}<span style="align-self:center;color:var(--muted)">→</span>${chip(p.range)}</div></div>
      <div class="sec"><h3>Asserted on classes <span class="n">${uses.length}</span></h3>
      ${uses.length ? chipList(uses.map(u => u[0]), 36, 'puse') : '<p class="desc empty">Declared in the schema but not used on any class in this file.</p>'}</div>`;
  } else {
    const id = selected.id, n = byId.get(id), cat = catOf.get(id);
    const catName = CATS.find(c => c.key === cat)?.name || 'Class';
    const ch = kids.get(id) || [];
    const outs = outRels.get(id) || [], ins = inRels.get(id) || [];
    const inBy = d3.group(ins, r => r[0]);
    const asDom = D.props.filter(p => p.domain === id), asRng = D.props.filter(p => p.range === id);
    h = `<div class="kicker ${catCls(id)}"><span class="dot"></span>${esc(catName)}</div>
      <h2>${esc(n.label)}</h2><div class="iri">${esc(IRI(id))}</div>
      ${id.startsWith('ttrpg:') ? '<div class="ns-note">Inherited from the parent TTRpg ontology.</div>' : ''}
      <hr class="rule">
      ${n.comment ? `<p class="desc">${esc(n.comment)}</p>` : `<p class="desc empty">No description in the ontology.</p>`}
      ${n.parents.length ? `<div class="sec"><h3>Subclass of <span class="n">${n.parents.length}</span></h3>${chipList(n.parents)}</div>` : ''}
      ${outs.length ? `<div class="sec"><h3>Relations</h3><div class="rel">${outs.map(([p, o]) =>
        `<span class="p">${esc(p.split(':')[1])}</span><div class="chips">${byId.has(o) || o.includes(':') ? chip(o) : `<span class="chip static">${esc(o)}</span>`}</div>`).join('')}</div></div>` : ''}
      ${ch.length ? `<div class="sec"><h3>Subclasses <span class="n">${ch.length}</span></h3>${chipList(ch, expandedMore.has('sub' + id) ? 1e9 : 36, 'sub' + id)}</div>` : ''}
      ${[...inBy].map(([p, rs]) => `<div class="sec"><h3>Referenced by · ${esc(p.split(':')[1])} <span class="n">${rs.length}</span></h3>
        ${chipList(rs.map(r => r[1]), expandedMore.has('in' + p + id) ? 1e9 : 36, 'in' + p + id)}</div>`).join('')}
      ${asDom.length || asRng.length ? `<div class="sec"><h3>Schema properties</h3><div class="rel">
        ${asDom.map(p => `<span class="p">${esc(p.id.split(':')[1])}</span><div class="chips">${chip(p.range)}</div>`).join('')}
        ${asRng.map(p => `<span class="p">← ${esc(p.id.split(':')[1])}</span><div class="chips">${chip(p.domain)}</div>`).join('')}</div></div>` : ''}
      <div class="actions"><button class="btn" id="show-tree">Show in tree</button></div>`;
  }
  h += `<div class="meta">Ontology by Ruben Wambacq, licensed CC BY 4.0. Includes only freely available SRD content.</div>`;
  detail.innerHTML = h;
  detail.scrollTop = 0;
  const st = document.getElementById('show-tree');
  if (st) st.onclick = () => { showTab('tree'); reveal(selected.id); };
}
detail.addEventListener('click', e => {
  const m = e.target.closest('[data-more]');
  if (m) { expandedMore.add(m.dataset.more); const k = detail.scrollTop; renderDetail(); detail.scrollTop = k; return; }
  const c = e.target.closest('[data-id]');
  if (c) select({ type: 'class', id: c.dataset.id }, true);
});

function select(s, doReveal, skipTree) {
  selected = s; expandedMore = new Set();
  renderDetail(); paintSchemaSel();
  if (doReveal && s?.type === 'class' && !document.getElementById('tree-svg').hidden) reveal(s.id);
  else if (!skipTree) renderTree(null);
}

/* ---------- search ---------- */
const q = document.getElementById('q'), res = document.getElementById('results');
const index = D.nodes.map(n => ({ id: n.id, l: n.label.toLowerCase(), k: n.id.toLowerCase() }));
let hits = [], hi = 0;
function doSearch() {
  const s = q.value.trim().toLowerCase();
  if (!s) { res.hidden = true; return; }
  hits = index.filter(x => x.l.includes(s) || x.k.includes(s))
    .sort((a, b) => (a.l.startsWith(s) ? 0 : 1) - (b.l.startsWith(s) ? 0 : 1) || a.l.localeCompare(b.l)).slice(0, 14);
  hi = 0;
  res.innerHTML = hits.length ? hits.map((x, i) => `<li role="option" data-i="${i}" aria-selected="${i === hi}" class="${catCls(x.id)}">
    <span class="dot"></span>${esc(lbl(x.id))}<small>${esc(CATS.find(c => c.key === catOf.get(x.id))?.name || '')}</small></li>`).join('')
    : '<li style="cursor:default;color:var(--muted)">No class matches that name</li>';
  res.hidden = false;
}
function pick(i) {
  const x = hits[i]; if (!x) return;
  res.hidden = true; q.value = lbl(x.id);
  showTab('tree'); select({ type: 'class', id: x.id }, true);
}
q.addEventListener('input', doSearch);
q.addEventListener('focus', () => { if (q.value) doSearch(); });
q.addEventListener('keydown', e => {
  if (res.hidden) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); hi = (hi + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % hits.length;
    res.querySelectorAll('li').forEach((li, i) => li.setAttribute('aria-selected', i === hi));
  } else if (e.key === 'Enter') { e.preventDefault(); pick(hi); }
  else if (e.key === 'Escape') res.hidden = true;
});
res.addEventListener('mousedown', e => { const li = e.target.closest('[data-i]'); if (li) { e.preventDefault(); pick(+li.dataset.i); } });
q.addEventListener('blur', () => setTimeout(() => res.hidden = true, 120));

/* ---------- start: categories open, Dexterity selected to show cross-links ---------- */
ROOT.open = true;
getKids(ROOT).forEach(c => c.open = true);
const start = byId.has('dnd:Dexterity') ? 'dnd:Dexterity' : D.nodes[0].id;
selected = { type: 'class', id: start };
renderDetail();
requestAnimationFrame(() => reveal(start));
</script>
